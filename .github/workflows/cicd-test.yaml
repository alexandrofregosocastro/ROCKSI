name: CI/CD ROCKSI

on:
  push:
    branches: [ "Desarrollo" ]
  pull_request:
    branches: [ "Desarrollo" ]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    # Configuracion de Java
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Compilar app
    - name: Compilar proyecto
      run: mvn clean install -DskipTests

    # pruebas unitarias (JUnit)
    - name: Ejecutar pruebas unitarias
      run: mvn test

    # Levantar APP (para UI/API)
    - name: Levantar servidor
      run: |
        mvn spring-boot:run &
        sleep 25

    # prubas API (postman)
    - name: Instalar Newman
      run: npm install -g newman

    - name: Ejecutar pruebas API
      run: newman run coleccion.json || true

    # Pruebas UI (playwright)
    - name: Instalar dependencias Node
      run: npm install

    - name: Instalar navegadores Playwright
      run: npx playwright install

    - name: Ejecutar pruebas UI
      run: npx playwright test || true

    # Generar reportes
    - name: Crear carpeta build
      run: mkdir build

    - name: Copiar reportes
      run: |
        cp -r target build/ || true
        cp -r playwright-report build/ || true

    # Subir artefactos
    - name: Subir artefactos
      uses: actions/upload-artifact@v4
      with:
        name: Reportes-ROCKSI
        path: build/
