<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Inicio de Sesión</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
        }
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .left-pane {
            width: 50%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .form-wrapper {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-top {
            max-width: 150px;
            margin-bottom: 30px;
            align-self: center;
        }

        h2.title {
            font-weight: 400;
            font-size: 28px;
            margin-bottom: 30px;
            color: #000;
            align-self: center;
        }

        .input-label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            margin-top: 15px;
            display: block;
        }

        .ui-inputfield {
            width: 100%;
            padding: 10px !important;
            border: 1px solid #ddd !important; /* Borde gris suave */
            background-color: #fcfcfc !important;
            box-shadow: none !important;
            border-radius: 2px !important;
            font-size: 14px;
        }

        .ui-inputfield:focus {
            border-color: #008bd2 !important;
        }

        .btn-submit {
            background-color: #008bd2;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 12px;
            font-size: 16px;
            width: 100%;
            margin-top: 30px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #0070a8;
        }
        .right-pane {
            width: 50%;
            background-color: #0286cf;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-circle {
            width: 70%;
            max-width: 450px;
            height: auto;
        }
        .ui-messages {
            width: 100%;
            margin-bottom: 15px;
        }
    </style>
</h:head>

<h:body>
    <div class="container">

        <div class="left-pane">

            <div class="form-wrapper">
                <h:graphicImage value="resources-20250903T164359Z-1-001/resources/Rock_on_text_logo.png" styleClass="logo-top" alt="Logo RockOn"/>

                <h2 class="title">Inicio de sesion</h2>

                <h:form id="loginForm" style="width: 100%;">

                    <p:messages id="messages" showDetail="false" autoUpdate="true" closable="true"/>

                    <h:outputLabel for="usuario" value="Usuario" styleClass="input-label"/>
                    <p:inputText id="usuario"
                                 value="#{loginBeanUI.idUsuario}"
                                 placeholder="Usuario"
                                 required="true"
                                 requiredMessage="Ingresa el usuario"/>

                    <h:outputLabel for="contrasena" value="Contraseña" styleClass="input-label"/>
                    <p:password id="contrasena"
                                value="#{loginBeanUI.contrasena}"
                                placeholder="Contraseña"
                                required="true"
                                requiredMessage="Ingresa la contraseña"
                                feedback="false"/>

                    <h:commandButton value="Iniciar sesión"
                                     action="#{loginBeanUI.iniciarSesion()}"
                                     styleClass="btn-submit"/>
                </h:form>
            </div>
        </div>

        <div class="right-pane">
            <h:graphicImage value="resources-20250903T164359Z-1-001/resources/rockon-icon.png" styleClass="logo-circle" alt="Logo Gym"/>
        </div>

    </div>
</h:body>
</html>
