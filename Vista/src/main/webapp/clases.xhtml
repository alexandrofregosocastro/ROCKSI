<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Clases - Rock On</title>
    <meta charset="UTF-8"/>

    <style>
        body {
            margin: 0;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #f8f9fb;
        }

        /* BARRA LATERAL */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #007bcb;
            color: white;
            position: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Menú principal dentro de la barra lateral */
        .sidebar .menu {
            width: 100%;
            padding-top: 30px;
        }

        /* Enlaces del menú  */
        .sidebar a,
        .sidebar h\:commandLink {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white !important;
            text-decoration: none !important;
            padding: 10px 20px;
            font-size: 15px;
            transition: background 0.3s, transform 0.2s;
            margin-bottom: 10px;
        }

        /* Hover y estado activo */
        .sidebar a:hover,
        .sidebar h\:commandLink:hover,
        .sidebar .active {
            background: #0061a6 !important;
            border-radius: 6px;
        }

        /* Ícono dentro del menú */
        .menu-icon {
            width: 22px;
            height: 22px;
            filter: brightness(0) invert(1);
            transition: transform 0.2s ease;
        }

        /* Animación de ícono al pasar el mouse */
        .sidebar h\:commandLink:hover .menu-icon {
            transform: scale(1.15);
        }

        /* Logo inferior */
        .sidebar .logo-bottom {
            padding: 25px 0;
        }

        .sidebar .logo-bottom img {
            width: 130px;
            border-radius: 50%;
        }

        /* ESTILOS GENERALES */
        body {
            margin: 0;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #f8f9fb;
        }

        /* CONTENEDOR PRINCIPAL */
        .main-content {
            margin-left: 220px;
            padding: 30px 40px;
        }

        /* Encabezado de la página (título "Clases") */
        .header-clientes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #007bcb;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .header-clientes h1 {
            font-size: 26px;
            color: #000;
            margin: 0;
            font-weight: 700;
        }

        /* TARJETA CONTENEDORA */
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* BOTONES DE ACCIÓN */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .action-buttons .ui-button {
            border: none !important;
            border-radius: 20px !important;
            font-weight: 600 !important;
            padding: 6px 16px !important;
            font-size: 14px !important;
        }

        .btn-registrar {
            background: #007bcb !important;
            color: #fff !important;
        }

        .btn-modificar {
            background: #007bcb !important;
            color: #fff !important;
        }

        .btn-baja {
            background: #007bcb !important;
            color: #fff !important;
        }

        /* TABLA DE CLASES */
        .ui-datatable {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: none !important;
            margin-top: 5px;
        }

        .ui-datatable thead th {
            background-color: #007bcb !important;
            color: white !important;
            text-align: left !important;
            font-weight: 600 !important;
            padding: 10px 12px !important;
            border: none !important;
            font-size: 14px !important;
        }

        .ui-datatable tbody td {
            padding: 10px 12px !important;
            font-size: 14px !important;
            color: #222;
            border: none !important;
        }

        .ui-datatable tr:nth-child(even) {
            background-color: #f9f9f9 !important;
        }

        .ui-datatable tr:nth-child(odd) {
            background-color: #fff !important;
        }

        .ui-datatable tr:hover {
            background-color: #eef7ff !important;
        }

        .ui-datatable-tablewrapper {
            border-radius: 10px;
            overflow: hidden;
        }

        /* Boton cerrar */
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-focus {
            background: transparent !important;
            border: none !important;
            color: #555 !important;
            position: absolute !important;
            right: 10px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            transition: all 0.3s ease !important;
            box-shadow: none !important;
        }

        /* Boton cerrar on hover*/
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close:hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover:hover {
            background-color: #dc3545 !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 28px !important;
            height: 28px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        /* Titulo del modal */
        .ui-dialog-title {
            width: 100% !important;
            text-align: center !important;
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #000 !important;
        }

        /* Contenido del modal */
        .form-group {
            background-color: #fff;
            border-radius: 15px;
            border: none;
            color: #000;
            padding: 20px;
        }

        /* Configracion del layout del modal */
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            width: 90%;
        }

        /* Configracion del layout del modal */
        .form-group label {
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .ui-dialog {
            background: white !important;
            border-radius: 15px !important;
            border: none !important;
        }

        /* Configuracion del titulo del modal */
        .ui-dialog-titlebar {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            position: relative;
            background: white !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .form-group {
            background: white !important;
            border: none !important;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .form-group {
            border: none;
            border-bottom: 2px solid #ccc;
            border-radius: 0;
            background: transparent;
            color: #000;
            font-size: 15px;
        }

        /* Configuracion de estilo en los campos cuando se aplica un focus*/
        .form-group:focus,
        .form-group:focus {
            border-color: #919191 !important;
            outline: none !important;
        }

        /* Configuracion en del boton registrar cliente*/
        .boton-registrar {
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 15px auto 0 auto !important;
            width: 80% !important;
        }

        /* Configuracion en del boton registrar cliente*/
        .boton-registrar {
            margin-right: 8px;
            font-size: 16px;
        }

        .ui-confirmdialog {
            z-index: 1100 !important;
        }

        .ui-widget-overlay {
            z-index: 1000 !important;
        }
    </style>
</h:head>

<h:body>
    <!-- Barra lateral -->
    <div class="sidebar">
        <div class="menu">
            <h:form>
                <!-- HOME -->
                <h:commandLink action="home.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('home')}"
                               styleClass="#{menuBeanUI.activePage eq 'home' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/home.png" alt="Home Icon" class="menu-icon"/>
                    <span>Home</span>
                </h:commandLink>

                <!-- CLIENTES -->
                <h:commandLink action="clientes.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clientes')}"
                               styleClass="#{menuBeanUI.activePage eq 'clientes' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clientes.png" alt="Clientes Icon" class="menu-icon"/>
                    <span>Clientes</span>
                </h:commandLink>

                <!-- TIENDA -->
                <h:commandLink action="tienda.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('tienda')}"
                               styleClass="#{menuBeanUI.activePage eq 'tienda' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/tienda.png" alt="Tienda Icon" class="menu-icon"/>
                    <span>Tienda</span>
                </h:commandLink>

                <!-- CLASES -->
                <h:commandLink action="clases.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clases')}"
                               styleClass="#{menuBeanUI.activePage eq 'clases' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clases.png" alt="Clases Icon" class="menu-icon"/>
                    <span>Clases</span>
                </h:commandLink>

                <!-- PAGOS -->
                <h:commandLink action="pagos.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('pagos')}"
                               styleClass="#{menuBeanUI.activePage eq 'pagos' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/pagos.png" alt="Pagos Icon" class="menu-icon"/>
                    <span>Pagos</span>
                </h:commandLink>
            </h:form>
        </div>

        <!-- Logo inferior -->
        <div class="logo-bottom">
            <img src="resources-20250903T164359Z-1-001/resources/rockon-icon.png" alt="Rock On Logo"/>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="card">
            <h:form id="formClases">
                <h1>Clases</h1>

                <div class="action-buttons" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                    <h:outputLabel for="txtFiltroClase" value="Buscar:"/>
                    <p:inputText id="txtFiltroClase"
                                 value="#{claseBeanUI.filtro}"
                                 placeholder="Buscar por ID o nombre de clase"
                                 styleClass="form-control"
                                 style="width:220px;">
                        <p:ajax event="input" listener="#{claseBeanUI.filtrar}" update="tablaClases" delay="300"/>
                    </p:inputText>

                    <!-- SUBMIT real (sin type="button") -->
                    <p:commandButton value="Actualizar Tabla" icon="pi pi-refresh"
                                     action="#{claseBeanUI.recargar}"
                                     update="tablaClases"
                                     styleClass="btn-registrar"/>

                    <!-- Abren diálogos -->
                    <p:commandButton value="Alta de Clase" icon="pi pi-plus-circle"
                                     onclick="PF('dlgAgregarClase').show();" styleClass="btn-registrar" type="button"/>
                    <p:commandButton value="Modificar Clase" icon="pi pi-user-edit"
                                     onclick="PF('dlgAskId').show();" styleClass="btn-modificar" type="button"/>
                    <p:commandButton value="Baja de Clase" icon="pi pi-user-minus"
                                     onclick="PF('dlgEliminarClase').show();" styleClass="btn-baja" type="button"/>
                    <p:commandButton value="Asignar clase a cliente"
                                     icon="pi pi-link"
                                     actionListener="#{claseBeanUI.recargar}"
                                     update=":formAsignarClase:asg_selectClase"
                                     oncomplete="PF('dlgAsignarClase').show();"
                                     styleClass="btn-registrar"/>

                    <p:commandButton value="Quitar cliente de clase"
                                     icon="pi pi-unlink"
                                     actionListener="#{claseBeanUI.recargar}"
                                     update=":formEliminarAsignacion:elim_selectClase"
                                     oncomplete="PF('dlgEliminarAsignacion').show();"
                                     styleClass="btn-baja"/>

                </div>

                <p:dataTable id="tablaClases"
                             value="#{claseBeanUI.listaClases}"
                             var="cla"
                             rowKey="#{cla.idClase}"
                             paginator="true"
                             rows="8"
                             emptyMessage="No hay clases registradas"
                             paginatorPosition="bottom"
                             style="margin-top:20px;">

                    <!-- Botón para expandir fila -->
                    <p:column style="width:50px; text-align:center;">
                        <p:rowToggler />
                    </p:column>

                    <p:column headerText="ID Clase" sortBy="#{cla.idClase}">
                        <h:outputText value="#{cla.idClase}" />
                    </p:column>
                    <p:column headerText="Nombre" sortBy="#{cla.nombre}">
                        <h:outputText value="#{cla.nombre}" />
                    </p:column>
                    <p:column headerText="Horario">
                        <h:outputText value="#{cla.horario}" />
                    </p:column>
                    <p:column headerText="Cupo Máx.">
                        <h:outputText value="#{cla.cupoMaximo}" />
                    </p:column>
                    <p:column headerText="Maestro">
                        <h:outputText value="#{cla.maestro}" />
                    </p:column>
                    <p:column headerText="Días">
                        <h:outputText value="#{cla.dias}" />
                    </p:column> <!--Aqui se agrego lo que faltaba de diasImpartidos-->

                    <!-- Subtabla expandible -->
                    <p:rowExpansion>
                        <p:dataTable value="#{cla.clientes}" var="cli" style="margin-left:20px" emptyMessage="Sin clientes asignados">
                            <p:column headerText="ID Cliente">
                                <h:outputText value="#{cli.idCliente}" />
                            </p:column>
                            <p:column headerText="Nombre Completo">
                                <h:outputText value="#{cli.nombreCompleto}" />
                            </p:column>
                            <p:column headerText="Teléfono">
                                <h:outputText value="#{cli.telefono}" />
                            </p:column>
                        </p:dataTable>
                    </p:rowExpansion>

                </p:dataTable>

            </h:form>
        </div>
    </div>

    <!-- dialogs -->

    <!-- alta de clase -->
    <p:dialog header="Nueva clase"
              widgetVar="dlgAgregarClase"
              modal="true"
              resizable="false"
              closable="true"
              draggable="false"
              width="420">
        <h:form id="formAltaClase">
            <p:messages id="msgsClase" showDetail="true" closable="true"/>

            <div class="form-group">
                <h:outputLabel for="alta_nombre" value="Nombre"/>
                <p:inputText id="alta_nombre"
                             value="#{altaClaBeanUI.nombre}"
                             required="true"
                             requiredMessage="El nombre es obligatorio"
                             styleClass="form-control"
                             placeholder="Ej. Escalado"/>
            </div>

            <div class="form-group">
                <h:outputLabel for="alta_horaI" value="Hora de inicio"/>
                <p:datePicker id="alta_horaI"
                              value="#{altaClaBeanUI.horaInicioDate}"
                              timeOnly="true"
                              pattern="HH:mm"
                              hourFormat="24"
                              required="true"
                              requiredMessage="Selecciona la hora de inicio"
                              styleClass="form-control"/>
            </div>

            <div class="form-group">
                <h:outputLabel for="alta_horaF" value="Hora final"/>
                <p:datePicker id="alta_horaF"
                              value="#{altaClaBeanUI.horaFinalDate}"
                              timeOnly="true"
                              pattern="HH:mm"
                              hourFormat="24"
                              required="true"
                              requiredMessage="Selecciona la hora final"
                              styleClass="form-control"/>
            </div>

            <div class="form-group">
                <h:outputLabel for="alta_cupo" value="Cupo máximo"/>
                <p:inputText id="alta_cupo"
                             value="#{altaClaBeanUI.cupoMaximo}"
                             required="true"
                             requiredMessage="El cupo es obligatorio"
                             styleClass="form-control"
                             placeholder="1">
                    <f:validateLongRange minimum="1" maximum="50"/>
                </p:inputText>
            </div>

            <div class="form-group">
                <h:outputLabel for="alta_maestro" value="Maestro"/>
                <p:inputText id="alta_maestro"
                             value="#{altaClaBeanUI.maestro}"
                             required="true"
                             requiredMessage="El maestro es obligatorio"
                             styleClass="form-control"
                             placeholder="Maestro"/>
            </div>

            <div class="form-group">
                <h:outputLabel for="alta_dias" value="Días en que se imparte (separados por comas)"/>
                <p:inputText id="alta_dias"
                             value="#{altaClaBeanUI.dias}"
                             required="true"
                             requiredMessage="Los días son obligatorios"
                             styleClass="form-control"
                             placeholder="Ej. Lunes, Miercoles, Viernes"/>
            </div>

            <p:commandButton value="Registrar"
                             icon="pi pi-plus-circle"
                             action="#{altaClaBeanUI.altaClase}"
                             process="@form"
                             update="formClases:tablaClases msgsClase"
                             styleClass="btn-registrar"/>
        </h:form>
    </p:dialog>


    <!-- ingresar id de clase a mdoificar -->
    <p:dialog header="Buscar clase a modificar"
              widgetVar="dlgAskId"
              modal="true"
              resizable="false"
              closable="true"
              draggable="false"
              width="380">
        <h:form id="formAskId">
            <p:messages id="msgsAsk" showDetail="true" closable="true"/>

            <div class="form-group">
                <h:outputLabel for="searchId" value="ID Clase"/>
                <p:inputText id="searchId"
                             value="#{modificarClaBeanUI.busquedaId}"
                             placeholder="Ej. CLA1001"
                             required="true"
                             requiredMessage="El ID es obligatorio"
                             styleClass="form-control"/>
            </div>

            <p:commandButton value="Buscar"
                             icon="pi pi-search"
                             action="#{modificarClaBeanUI.cargarClasePorId}"
                             process="@form"
                             update=":formAskId:msgsAsk :formModificarClase"
                             oncomplete="if (args &amp;&amp; args.found) { PF('dlgAskId').hide(); PF('dlgModificarClase').show(); }"/>
        </h:form>
    </p:dialog>


    <!-- modificacion de clase -->
    <p:dialog header="Modificar clase"
              widgetVar="dlgModificarClase"
              modal="true"
              resizable="false"
              closable="true"
              draggable="false"
              width="420">
        <h:form id="formModificarClase">
            <p:messages id="msgsModificar" showDetail="true" closable="true"/>

            <div class="form-group">
                <h:outputLabel for="mod_nombre" value="Nombre"/>
                <p:inputText id="mod_nombre"
                             value="#{modificarClaBeanUI.nombre}"
                             required="true"
                             requiredMessage="El nombre es obligatorio"
                             styleClass="form-control"/>
            </div>

            <div class="form-group">
                <h:outputLabel for="alta_horaI" value="Hora de inicio"/>
                <p:datePicker id="horaInicio"
                              value="#{modificarClaBeanUI.horaInicioDate}"
                              pattern="HH:mm"
                              timeOnly="true"
                              hourFormat="24"
                              showIcon="true"
                              converterMessage="Hora inválida. Usa formato HH:mm."/>
            </div>

            <div class="form-group">
                <h:outputLabel for="alta_horaF" value="Hora final"/>
                <p:datePicker id="horaFinal"
                              value="#{modificarClaBeanUI.horaFinalDate}"
                              pattern="HH:mm"
                              timeOnly="true"
                              hourFormat="24"
                              showIcon="true"
                              converterMessage="Hora inválida. Usa formato HH:mm."/>
            </div>

            <div class="form-group">
                <h:outputLabel for="mod_cupo" value="Cupo máximo"/>
                <p:inputText id="mod_cupo"
                             value="#{modificarClaBeanUI.cupoMaximo}"
                             required="true"
                             requiredMessage="El cupo es obligatorio"
                             styleClass="form-control">
                    <f:validateLongRange minimum="1" maximum="200"/>
                </p:inputText>
            </div>

            <div class="form-group">
                <h:outputLabel for="mod_maestro" value="Maestro"/>
                <p:inputText id="mod_maestro"
                             value="#{modificarClaBeanUI.maestro}"
                             required="true"
                             requiredMessage="El maestro es obligatorio"
                             styleClass="form-control"/>
            </div>

            <div class="form-group">
                <h:outputLabel for="mod_diasImpartida" value="Dias en los que se imparte"/>
                <p:inputText id="mod_diasImpartida"
                             value="#{modificarClaBeanUI.diasImpartidos}"
                             required="true"
                             requiredMessage="Dias impatidos de la materia es obligatorio"
                             styleClass="form-control"/>
            </div>

            <p:commandButton value="Guardar cambios"
                             icon="pi pi-check"
                             onclick="PF('dlgConfirmar').show(); return false;"
                             process="@form"
                             styleClass="btn-modificar"/>


        <p:confirmDialog id="confirmDialog"
                         widgetVar="dlgConfirmar"
                         header="Confirmar Modificación"
                         message="¿Seguro que deseas modificar la clase?"
                         icon="pi pi-exclamation-triangle"
                         closable="false" modal="true">

            <p:commandButton value="Sí, Modificar"
                             icon="pi pi-check"
                             action="#{modificarClaBeanUI.modificarClase()}"
                             process="@form"
                             update="msgsModificar :formClases:tablaClases"
                             oncomplete="PF('dlgConfirmar').hide();"
                             style="background:#007bff !important; color:#fff !important; border:none !important;"/>

            <p:commandButton value="Cancelar"
                             icon="pi pi-times"
                             onclick="PF('dlgConfirmar').hide(); PF('dlgModificarClase').hide(); return false;"
                             type="button"
                             style="background:#007bff !important; color:#fff !important; border:none !important;"/>
        </p:confirmDialog>
        </h:form>
    </p:dialog>
    <!-- baja de clases -->
    <p:dialog header="Eliminar Clase"
              widgetVar="dlgEliminarClase"
              modal="true" resizable="false" closable="true" draggable="false" width="380">
        <h:form id="formEliminarClase">
            <p:messages id="msgsEliminarClase" showDetail="true" closable="true"/>

            <div class="form-group">
                <h:outputLabel for="elim_idClase" value="ID de la clase"/>
                <p:inputText id="elim_idClase"
                             value="#{bajaClaseBeanUI.idClase}"
                             required="true"
                             requiredMessage="El ID es obligatorio"
                             styleClass="form-control"/>
            </div>

            <!-- solo abre confirmacion en caso de que se haya validado que se ingreso un id -->
            <p:commandButton value="Eliminar"
                             icon="pi pi-times-circle"
                             process="@form"
                             update="msgsEliminarClase"
                             oncomplete="if (!args.validationFailed) { PF('dlgEliminarClase').hide(); PF('dlgConfirmarEliminarClase').show(); }"
                             styleClass="btn-baja"/>
        </h:form>
    </p:dialog>


    <!-- Confirmacion de eliminaciomn -->
    <p:dialog header="Confirmar eliminación"
              widgetVar="dlgConfirmarEliminarClase"
              modal="true" resizable="false" closable="false" draggable="false" width="380">
        <h:form id="formConfirmarEliminar">
            <div style="margin-bottom:16px;">¿Seguro que deseas eliminar esta clase?</div>

            <p:commandButton value="Cancelar"
                             icon="pi pi-times"
                             type="button"
                             onclick="PF('dlgConfirmarEliminarClase').hide(); PF('dlgEliminarClase').show();"/>

            <p:commandButton value="Eliminar"
                             icon="pi pi-check"
                             action="#{bajaClaseBeanUI.eliminarClase}"
                             process="@this"
                             update=":formEliminarClase:msgsEliminarClase :formClases:tablaClases"
                             oncomplete="
                            if (!args.validationFailed) {
                                PF('dlgConfirmarEliminarClase').hide();
                                PF('dlgEliminarClase').show();
                            }"
                             styleClass="btn-confirmar"/>
        </h:form>
    </p:dialog>

    <!-- asignar clase -->
    <p:dialog header="Asignar clase a cliente" widgetVar="dlgAsignarClase" modal="true" resizable="false" closable="true" draggable="false" width="420">
        <h:form id="formAsignarClase">
            <p:messages id="msgsAsignar" showDetail="true" closable="true"/>
            <div class="form-group">
                <h:outputLabel for="asg_idCliente" value="ID Cliente"/>
                <p:inputText id="asg_idCliente" value="#{asignarClaseBeanUI.idCliente}"
                             required="true" requiredMessage="El ID Cliente es obligatorio" styleClass="form-control"/>
            </div>
            <div class="form-group">
                <h:outputLabel for="asg_selectClase" value="Clase"/>
                <p:selectOneMenu id="asg_selectClase" value="#{asignarClaseBeanUI.idClase}"
                                 required="true" requiredMessage="Seleccione una clase" styleClass="form-control">
                    <f:selectItem itemLabel="-- Seleccione --" itemValue="" />
                    <f:selectItems value="#{claseBeanUI.listaClases}" var="c"
                                   itemValue="#{c.idClase}" itemLabel="#{c.nombre}"/>
                </p:selectOneMenu>
            </div>
            <p:commandButton value="Asignar" icon="pi pi-check"
                             action="#{asignarClaseBeanUI.asignarClase}"
                             process="@form"
                             update="msgsAsignar formClases:tablaClases"
                             styleClass="btn-registrar"/>
        </h:form>
    </p:dialog>

    <!-- Dialogo para eliminar asignación -->
    <p:dialog header="Quitar cliente de clase"
              widgetVar="dlgEliminarAsignacion"
              modal="true"
              resizable="false"
              closable="true"
              draggable="false"
              width="420">

        <h:form id="formEliminarAsignacion">
            <p:messages id="msgsEliminarAsignacion" showDetail="true" closable="true"/>

            <div class="form-group">
                <h:outputLabel for="elim_idCliente" value="ID Cliente"/>
                <p:inputText id="elim_idCliente"
                             value="#{eliminarAsignacionBeanUI.idCliente}"
                             required="true"
                             requiredMessage="El ID del cliente es obligatorio"
                             styleClass="form-control"/>
            </div>

            <div class="form-group">
                <h:outputLabel for="elim_selectClase" value="Clase"/>
                <p:selectOneMenu id="elim_selectClase"
                                 value="#{eliminarAsignacionBeanUI.idClase}"
                                 required="true"
                                 requiredMessage="Seleccione una clase"
                                 styleClass="form-control">
                    <f:selectItem itemLabel="-- Seleccione --" itemValue=""/>
                    <f:selectItems value="#{claseBeanUI.listaClases}" var="c"
                                   itemValue="#{c.idClase}" itemLabel="#{c.nombre}"/>
                </p:selectOneMenu>
            </div>

            <p:commandButton value="Quitar asignación"
                             icon="pi pi-trash"
                             action="#{eliminarAsignacionBeanUI.eliminarAsignacion}"
                             process="@form"
                             update="msgsEliminarAsignacion :formClases:tablaClases"
                             styleClass="btn-baja"/>
        </h:form>
    </p:dialog>


</h:body>
</html>
