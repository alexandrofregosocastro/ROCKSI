<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Pagos - Rock On</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <meta charset="UTF-8"/>
    <style>
        body {
            margin: 0;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #f8f9fb;
        }

        /* --- BARRA LATERAL --- */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #007bcb;
            color: white;
            position: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar .menu {
            width: 100%;
            padding-top: 30px;
        }

        .sidebar a,
        .sidebar h\:commandLink {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white !important;
            text-decoration: none !important;
            padding: 10px 20px;
            font-size: 15px;
            transition: background 0.3s, transform 0.2s;
            margin-bottom: 10px;
        }

        .sidebar a:hover,
        .sidebar h\:commandLink:hover,
        .sidebar .active {
            background: #0061a6 !important;
            border-radius: 6px;
        }

        .menu-icon {
            width: 22px;
            height: 22px;
            filter: brightness(0) invert(1);
            transition: transform 0.2s ease;
        }

        .sidebar h\:commandLink:hover .menu-icon {
            transform: scale(1.15);
        }

        .sidebar .logo-bottom {
            padding: 25px 0;
        }

        .sidebar .logo-bottom img {
            width: 130px;
            border-radius: 50%;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content {
            margin-left: 220px;
            padding: 30px 40px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* --- ENCABEZADO --- */
        .header-pagos {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #007bcb;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header-pagos h1 {
            font-size: 26px;
            font-weight: 700;
            color: #000;
            margin: 0;
        }

        /* --- BOTONES DE ACCIÓN --- */
        .action-buttons {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .ui-button {
            border: none !important;
            border-radius: 20px !important;
            font-weight: 600 !important;
            padding: 6px 18px !important;
            font-size: 14px !important;
            background: #007bcb !important;
            color: white !important;
            transition: background 0.2s ease;
        }

        .ui-button:hover {
            background: #0061a6 !important;
        }

        /* --- TABLA --- */
        .ui-datatable {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: none !important;
            margin-top: 10px;
        }

        .ui-datatable thead th {
            background-color: #007bcb !important;
            color: #fff !important;
            text-align: left !important;
            font-weight: 600 !important;
            padding: 10px 12px !important;
            border: none !important;
        }

        .ui-datatable tbody td {
            padding: 10px 12px !important;
            font-size: 14px !important;
            color: #222;
            border: none !important;
        }

        .ui-datatable tr:nth-child(even) {
            background-color: #f9f9f9 !important;
        }

        .ui-datatable tr:hover {
            background-color: #eef7ff !important;
        }

        .texto-vacio {
            font-style: italic !important;
            color: #999 !important;
        }

        /* --- DIALOG CAJA --- */
        .ui-dialog {
            border-radius: 15px !important;
            border: none !important;
        }

        .ui-dialog-titlebar {
            background: white !important;
            border: none !important;
            text-align: center !important;
        }

        .ui-dialog-title {
            font-weight: 700;
            font-size: 22px;
            color: #000;
        }

        .dialog-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px 10px;
            margin-top: 15px;
        }

        .dialog-buttons .ui-button {
            width: 100%;
            padding: 10px 14px !important;
            font-size: 15px !important;
            border-radius: 12px !important;
        }

        /* Aplicar solo a los dialogs que tengan la clase 'dialog-compra' */
        .dialog-compra .ui-dialog {
            border-radius: 15px !important;
            border: none !important;
            background: white !important;
        }

        .dialog-compra .ui-dialog-titlebar {
            background: white !important;
            border: none !important;
            text-align: center !important;
            font-weight: bold !important;
        }

        .dialog-compra .ui-dialog-content {
            background: white !important;
            border: none !important;
        }

        .dialog-compra .form-control,
        .dialog-compra .ui-inputfield {
            border: none;
            border-bottom: 2px solid #ccc;
            border-radius: 0;
            background: transparent;
            color: #000;
            font-size: 15px;
            width: 100%;
        }

        .dialog-compra .form-control:focus,
        .dialog-compra .ui-inputfield:focus {
            border-color: #919191 !important;
            outline: none !important;
        }

        .dialog-compra .ui-button {
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            width: 80% !important;
            margin: 15px auto 0 auto !important;
            display: block;
        }

        .status-pendiente {
            color: #D32F2F; /* Rojo o Naranja */
            font-weight: bold;
            background-color: #FFEBEE;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .status-pagado {
            color: #2E7D32; /* Verde */
            font-weight: bold;
            background-color: #E8F5E9;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .sidebar-footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
        }

        .sidebar-footer form {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .logout-link {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            color: white !important;
            text-decoration: none !important;
            padding: 10px 20px !important;
            font-size: 15px !important;
            transition: background 0.3s, transform 0.2s !important;
            width: 100% !important;
            box-sizing: border-box !important;
            cursor: pointer;
            border-radius: 0 !important;
        }

        .logout-link:hover {
            background: #0061a6 !important;
        }

        .logout-icon {
            width: 22px;
            height: 22px;
            font-size: 1.2rem;
        }

    </style>
</h:head>

<h:body>

    <div class="sidebar">
        <div class="menu">
            <h:form>
                <h:commandLink action="home.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('home')}"
                               styleClass="#{menuBeanUI.activePage eq 'home' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/home.png" alt="Home Icon" class="menu-icon"/>
                    <span>Home</span>
                </h:commandLink>

                <h:commandLink action="clientes.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clientes')}"
                               styleClass="#{menuBeanUI.activePage eq 'clientes' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clientes.png" alt="Clientes Icon" class="menu-icon"/>
                    <span>Clientes</span>
                </h:commandLink>

                <h:commandLink action="tienda.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('tienda')}"
                               styleClass="#{menuBeanUI.activePage eq 'tienda' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/tienda.png" alt="Tienda Icon" class="menu-icon"/>
                    <span>Tienda</span>
                </h:commandLink>

                <h:commandLink action="clases.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clases')}"
                               styleClass="#{menuBeanUI.activePage eq 'clases' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clases.png" alt="Clases Icon" class="menu-icon"/>
                    <span>Clases</span>
                </h:commandLink>

                <h:commandLink action="pagos.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('pagos')}"
                               styleClass="#{menuBeanUI.activePage eq 'pagos' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/pagos.png" alt="Pagos Icon" class="menu-icon"/>
                    <span>Pagos</span>
                </h:commandLink>
                <h:commandLink action="usuarios.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('usuarios')}"
                               styleClass="#{menuBeanUI.activePage eq 'usuarios' ? 'active' : ''}" rendered="#{loginBeanUI.isAdmin()}"> <img src="resources-20250903T164359Z-1-001/resources/clientes.png" alt="Usuarios Icon" class="menu-icon"/>
                    <span>Usuarios</span>
                </h:commandLink>
            </h:form>
        </div>

        <div class="sidebar-footer">

            <h:form>
                <h:commandLink action="#{loginBeanUI.cerrarSesion}" styleClass="logout-link">
                    <i class="pi pi-power-off logout-icon"></i>
                    <span>Cerrar Sesión</span>
                </h:commandLink>
            </h:form>

            <div class="logo-bottom">
                <img src="resources-20250903T164359Z-1-001/resources/rockon-icon.png" alt="Rock On Logo"/>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <h:form id="formPagos">
                <h1>Pagos</h1>

                <div class="action-buttons" style="display:flex; justify-content:flex-end; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:15px;">

                    <h:outputLabel for="buscarPago" value="ID Pago" style="font-weight:600;"/>
                    <p:inputText id="buscarPago" value="#{pagoBeanUI.filtro}"
                                 placeholder="Buscar por ID Pago"
                                 style="width:200px;">
                        <p:ajax event="input" listener="#{pagoBeanUI.filtrarPorId}"
                                update="tablaPagos" delay="300"/>
                    </p:inputText>

                    <p:commandButton value="Actualizar Tabla" icon="pi pi-refresh"
                                     actionListener="#{pagoBeanUI.recargar}"
                                     process="@this"
                                     update=":formPagos:tablaPagos :formPagos:buscarPago"/>

                    <p:commandButton value="Realizar Pago clase"
                                     icon="pi pi-shopping-cart"
                                     onclick="PF('dlgMetodoPago2').show();"
                                     type="button"/>

                    <p:commandButton value="Realizar Pago Membresia"
                                     icon="pi pi-shopping-cart"
                                     onclick="PF('dlgMetodoPago1').show();"
                                     type="button"/>

                    <p:commandButton value="Cancelar pago"
                                     icon="pi pi-times"
                                     type="button"
                                     onclick="PF('dlgCancelarPago').show()" />

                    <p:dialog header="Cancelar Pago"
                              widgetVar="dlgCancelarPago"
                              modal="true"
                              closable="false"
                              resizable="false"
                              draggable="false">

                        <h:panelGrid columns="2" cellpadding="5">

                            <h:outputLabel for="pagoId" value="ID del Pago:" />
                            <p:inputText id="pagoId"
                                         value="#{pagoBeanUI.idPagoCancelar}"
                                         required="true"
                                         requiredMessage="Debes ingresar un ID de pago." />

                        </h:panelGrid>

                        <p:separator />

                        <p:commandButton value="Aceptar"
                                         icon="pi pi-check"
                                         actionListener="#{pagoBeanUI.cancelarPago()}"
                                         update=":formPagos"
                                         oncomplete="if (!args.validationFailed) PF('dlgCancelarPago').hide();" />

                        <p:commandButton value="Cerrar"
                                         icon="pi pi-times"
                                         type="button"
                                         onclick="PF('dlgCancelarPago').hide()" />

                    </p:dialog>

                    <p:commandButton value="Abrir la caja" icon="pi pi-inbox"
                                     onclick="PF('dlgCaja').show(); return false;"
                                     type="button"/>

                </div>

                <p:dataTable id="tablaPagos" value="#{pagoBeanUI.listaPagos}" var="pa"
                             paginator="true" rows="8"
                             paginatorPosition="bottom"
                             emptyMessage="No hay pagos registrados">

                    <p:column headerText="ID" sortBy="#{pa.idPaga}">
                        <h:outputText value="#{pa.idPaga}"/>
                    </p:column>

                    <p:column headerText="Nombre del cliente" sortBy="#{pa.idCliente}">
                        <h:outputText value="#{pa.idCliente.nombreCompleto}"/>
                    </p:column>

                    <p:column headerText="Producto" sortBy="#{pa.idItem.idItem}">
                        <h:outputText value="#{pa.idItem.idItem}" />
                    </p:column>

                    <p:column headerText="Observaciones" sortBy="#{pa.observaciones}">
                        <h:outputText value="#{empty pa.observaciones ? 'Ninguna observación' : pa.observaciones}"
                                      styleClass="#{empty pa.observaciones ? 'texto-vacio' : ''}"/>
                    </p:column>

                    <p:column headerText="Fecha de pago" sortBy="#{pa.fecha}">
                        <h:outputText value="#{pa.fecha}"/>
                    </p:column>

                    <p:column headerText="Monto" sortBy="#{pa.monto}">
                        <h:outputText value="#{pa.monto}"/>
                    </p:column>

                    <p:column headerText="A pagar" sortBy="#{pa.porPagar}">
                        <h:outputText value="#{pa.porPagar == 1 ? 'Por Pagar' : 'Pagado'}"
                                      styleClass="#{pa.porPagar == 1 ? 'status-pendiente' : 'status-pagado'}" />
                    </p:column>
                </p:dataTable>

            </h:form>
            <h:form id="formReportes" style="display:flex; justify-content:flex-end; gap:10px; margin: 15px 0;">

                <p:commandButton value="Generar Reporte Diario"
                                 icon="pi pi-file-pdf"
                                 action="#{reporteBeanUI.descargarReporteDiario}"
                                 ajax="false"
                                 styleClass="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-icon-left"
                                 style="background:#007bff; color:#fff; border:none;"/>

                <p:commandButton value="Generar Reporte Mensual"
                                 icon="pi pi-file-pdf"
                                 action="#{reporteMensualBeanUI.descargarReporteMensual}"
                                 ajax="false"
                                 styleClass="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-icon-left"
                                 style="background:#007bff; color:#fff; border:none;"/>
            </h:form>
        </div>
    </div>
    <h:form id="formPrincipal">

        <p:remoteCommand name="autoAbrirPago" action="#{RealizarPagoBeanUI.verificarAperturaAutomatica}" autoRun="true" />

        <p:remoteCommand name="autoAbrirPagoMembresia" action="#{RealizarPagoBeanUI.verificarAperturaAutomatica1}" autoRun="true" />

        <p:dialog header="Seleccionar Método de Pago" widgetVar="dlgMetodoPago1"
                  modal="true" resizable="false" closable="true" draggable="false" width="360">
            <h:panelGrid id="panelMetodoPago1" columns="1" style="width:100%; text-align:center;">

                <p:messages id="msgsMetodoPago1" showDetail="true" closable="true"/>

                <div class="form-group">
                    <h:outputLabel for="cliente1" value="Cliente (opcional)" style="font-weight:bold;"/>
                    <p:inputText id="cliente1"
                                 value="#{RealizarPagoBeanUI.idCliente}"
                                 maxlength="7"
                                 onkeydown="if(event.key === 'Enter'){event.preventDefault(); return false;}"
                                 placeholder="CLI1000"
                                 styleClass="form-control">
                    </p:inputText>
                </div>

                <div class="form-group">
                    <h:outputLabel for="descuento1" value="Descuento (opcional)" style="font-weight:bold;"/>
                    <p:inputNumber id="descuento1"
                                   value="#{RealizarPagoBeanUI.descuento}"
                                   minValue="0"
                                   decimalPlaces="2"
                                   placeholder="$200"
                                   style="width: 100%;">
                    </p:inputNumber>
                </div>

                <p:commandButton value="Pago en Efectivo"
                                 icon="pi pi-money-bill"
                                 actionListener="#{RealizarPagoBeanUI.prepararPago('membresia')}"
                                 process="@this cliente1 descuento1"
                                 update="panelMetodoPago1 :formPrincipal:panelPagoInteractivo1 :formPrincipal:panelAplicarCredito1"
                                 oncomplete="if (!args.validationFailed) {
                            PF('dlgMetodoPago1').hide();
                            if (args.tieneCredito) {
                                PF('dlgAplicarCredito1').show();
                            } else {
                                PF('dlgPagoInteractivo1').show();
                            }
                        }"
                                 style="margin-bottom:10px; background:#ffc107; color:#000;">
                    <f:param name="proximo" value="dlgPagoInteractivo1" />
                </p:commandButton>

                <p:commandButton value="Pago con Tarjeta"
                                 icon="pi pi-credit-card"
                                 actionListener="#{RealizarPagoBeanUI.prepararPago('membresia')}"
                                 process="@this cliente1 descuento1"
                                 update="panelMetodoPago1 :formPrincipal:panelPagoTarjeta1 :formPrincipal:panelAplicarCredito1"
                                 oncomplete="if (!args.validationFailed) {
                            PF('dlgMetodoPago1').hide();
                            if (args.tieneCredito) {
                                PF('dlgAplicarCredito1').show();
                            } else {
                                PF('dlgPagoTarjeta1').show();
                            }
                        }"
                                 style="background:#17a2b8; color:#fff;">
                    <f:param name="proximo" value="dlgPagoTarjeta1" />
                </p:commandButton>

            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Confirmar Crédito" widgetVar="dlgAplicarCredito1"
                  modal="true" resizable="false" closable="false" draggable="false" width="420">

            <h:panelGrid id="panelAplicarCredito1" columns="1" style="width:100%; text-align:center;">
                <p:messages id="msgsCredito1" showDetail="true" closable="true"/>

                <h:outputText value="El cliente tiene un crédito disponible de:"
                              style="font-size:16px;"/>

                <h:outputText value="#{RealizarPagoBeanUI.cliente.credito}"
                              style="font-size:22px; font-weight:bold; color:#28a745; margin:5px 0;">
                    <f:convertNumber type="currency" currencySymbol="$"/>
                </h:outputText>

                <h:outputText value="Total actual de la compra:"
                              style="font-size:16px; margin-top:10px;"/>
                <h:outputText value="#{RealizarPagoBeanUI.montoTotal}"
                              style="font-size:18px; font-weight:bold;">
                    <f:convertNumber type="currency" currencySymbol="$"/>
                </h:outputText>

                <h:outputText value="¿Desea aplicar el crédito a esta compra?"
                              style="font-size:16px; margin-top:15px; font-weight:bold;"/>

                <h:outputText value="Esta acción es irreversible y modificará el saldo del cliente."
                              style="font-size:13px; font-style:italic; color:#777;"/>

                <p:commandButton value="Sí, Aplicar Crédito"
                                 icon="pi pi-check"
                                 action="#{RealizarPagoBeanUI.aplicarCredito}"
                                 process="@this"
                                 update="panelAplicarCredito1 msgsCredito1 :formPrincipal:panelPagoTarjeta1 :formPrincipal:panelPagoInteractivo1"
                                 oncomplete="if (!args.validationFailed) { PF('dlgAplicarCredito1').hide(); PF('#{RealizarPagoBeanUI.siguienteDialogo}').show(); }"
                                 style="background:#28a745; color:#fff;"/>

                <p:commandButton value="No, Pagar Completo"
                                 icon="pi pi-times"
                                 type="button"
                                 onclick="PF('dlgAplicarCredito1').hide(); PF('#{RealizarPagoBeanUI.siguienteDialogo}').show();"
                                 style="background:#dc3545; color:#fff;"/>

            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Pago con Tarjeta"
                  widgetVar="dlgPagoTarjeta1"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="420">

            <h:panelGrid id="panelPagoTarjeta1" columns="1" style="width:100%;">
                <p:messages id="msgsTarjeta1" showDetail="true" closable="true"/>

                <h:outputText value="Información del Cliente:" style="font-weight:bold; margin-bottom:10px;"/>

                <h:panelGrid columns="2" columnClasses="label,value" style="width:100%;">
                    <h:outputText value="ID Cliente:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.cliente.idCliente}" style="color:#000000;"/>

                    <h:outputText value="Nombre del cliente:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.cliente.nombreCompleto}" style="color:#000000;"/>

                    <h:outputText value="Monto Total:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.montoTotal}" style="color:#000000;"/>

                    <h:outputText value="Fecha:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.fecha}" style="color:#000000;">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                    </h:outputText>

                    <h:outputText value="Método de pago:" style="color:#000000;"/>
                    <h:outputText value="Tarjeta de crédito/débito" style="color:#17a2b8; font-weight:bold;"/>
                </h:panelGrid>

                <h:outputText value="Por favor, realice el cobro manual en la terminal bancaria."
                              style="margin-top:10px; display:block; text-align:center; font-style:italic;"/>

                <h:panelGroup layout="block" style="margin-top:15px; text-align:center;">
                    <p:commandButton id="btnPagoTarjeta1"
                                     value="Pagar"
                                     process="@this"
                                     update="msgsTarjeta1"
                                     actionListener="#{RealizarPagoBeanUI.realizarPagoTarjetaMembresia()}"/>

                    <p:commandButton value="Cancelar"
                                     icon="pi pi-times"
                                     actionListener="#{RealizarPagoBeanUI.limpiarCampos()}"
                                     update="@form"
                                     process="@this"
                                     oncomplete="PF('dlgPagoTarjeta1').hide();"
                                     style="background:#dc3545; color:#fff;"/>
                </h:panelGroup>
            </h:panelGrid>
        </p:dialog>

        <p:dialog id="dlgExitoTarjeta1"
                  header="Pago Realizado"
                  widgetVar="dlgExitoTarjeta1"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="300">

            <h:panelGrid columns="1" style="width:100%; text-align:center;">
                <h:outputText value="Pago realizado con éxito"
                              style="font-weight:bold; font-size:18px; color:#28a745;"/>

                <h:outputText value="El cobro con tarjeta se procesó correctamente."
                              style="font-size:14px; color:#333; margin-top:10px;"/>

                <p:commandButton value="Continuar"
                                 icon="pi pi-check"
                                 actionListener="#{RealizarPagoBeanUI.limpiarCampos()}"
                                 onclick="PF('dlgExitoTarjeta1').hide();"
                                 update="@form"
                                 style="margin-top:15px; background:#28a745; color:#fff; width:100%;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Realizar Pago en Efectivo"
                  widgetVar="dlgPagoInteractivo1"
                  modal="true"
                  resizable="false"
                  closable="true"
                  draggable="false"
                  width="400">

            <h:panelGrid id="panelPagoInteractivo1" columns="1" style="width:100%;">
                <p:messages id="msgsPagoInteractivo1" showDetail="true" closable="true"/>

                <div class="form-group">
                    <h:outputLabel for="montoIngresado1" value="Monto ingresado"/>
                    <p:inputNumber id="montoIngresado1"
                                   value="#{RealizarPagoBeanUI.montoIngresado}"
                                   minValue="0"
                                   decimalPlaces="2"
                                   style="width: 100%;">
                        <p:ajax event="keyup" update="faltante1" process="@this"/>
                    </p:inputNumber>
                </div>

                <div class="form-group">
                    <h:outputLabel value="Monto restante"/>
                    <h:outputText id="faltante1" value="#{RealizarPagoBeanUI.montoFaltante}"/>
                </div>

                <p:commandButton value="Pagar"
                                 action="#{RealizarPagoBeanUI.realizarPagoInteractivoMembresia()}"
                                 update="msgsPagoInteractivo1 faltante1"
                                 styleClass="ui-button"
                                 process="@this montoIngresado1"
                                 style="background:#28a745; color:#fff;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog id="dlgCambio1"
                  header="Cambio Entregado"
                  widgetVar="dlgCambio1"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="300">

            <h:panelGrid columns="1" style="width:100%; text-align:center;">
                <h:outputText value="Cambio:" style="font-weight:bold; font-size:18px;"/>
                <h:outputText value="$#{RealizarPagoBeanUI.montoCambio}"
                              style="font-size:22px; color:#28a745; margin:10px 0; display:block;">
                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                </h:outputText>

                <p:commandButton value="Continuar"
                                 icon="pi pi-check"
                                 actionListener="#{RealizarPagoBeanUI.limpiarCampos()}"
                                 onclick="PF('dlgCambio1').hide();"
                                 update="@form"
                                 style="margin-top:10px; background:#28a745; color:#fff; width:100%;"/>
            </h:panelGrid>
        </p:dialog>


        <p:dialog header="Seleccionar Método de Pago" widgetVar="dlgMetodoPago2"
                  modal="true" resizable="false" closable="true" draggable="false" width="360">
            <h:panelGrid id="panelMetodoPago2" columns="1" style="width:100%; text-align:center;">

                <p:messages id="msgsMetodoPago2" showDetail="true" closable="true"/>

                <div class="form-group">
                    <h:outputLabel for="cliente2" value="Cliente (opcional)" style="font-weight:bold;"/>
                    <p:inputText id="cliente2"
                                 value="#{RealizarPagoBeanUI.idCliente}"
                                 maxlength="7"
                                 onkeydown="if(event.key === 'Enter'){event.preventDefault(); return false;}"
                                 placeholder="CLI1000"
                                 styleClass="form-control">
                    </p:inputText>
                </div>

                <div class="form-group">
                    <h:outputLabel for="descuento2" value="Descuento (opcional)" style="font-weight:bold;"/>
                    <p:inputNumber id="descuento2"
                                   value="#{RealizarPagoBeanUI.descuento}"
                                   minValue="0"
                                   decimalPlaces="2"
                                   placeholder="$200"
                                   style="width: 100%;">
                    </p:inputNumber>
                </div>

                <p:commandButton value="Pago en Efectivo"
                                 icon="pi pi-money-bill"
                                 actionListener="#{RealizarPagoBeanUI.prepararPago('clase')}"
                                 process="@this cliente2 descuento2"
                                 update="panelMetodoPago2 :formPrincipal:panelPagoInteractivo2 :formPrincipal:panelAplicarCredito2"
                                 oncomplete="if (!args.validationFailed) {
                            PF('dlgMetodoPago2').hide();
                            if (args.tieneCredito) {
                                PF('dlgAplicarCredito2').show();
                            } else {
                                PF('dlgPagoInteractivo2').show();
                            }
                        }"
                                 style="margin-bottom:10px; background:#ffc107; color:#000;">
                    <f:param name="proximo" value="dlgPagoInteractivo2" />
                </p:commandButton>

                <p:commandButton value="Pago con Tarjeta"
                                 icon="pi pi-credit-card"
                                 actionListener="#{RealizarPagoBeanUI.prepararPago('clase')}"
                                 process="@this cliente2 descuento2"
                                 update="panelMetodoPago2 :formPrincipal:panelPagoTarjeta2 :formPrincipal:panelAplicarCredito2"
                                 oncomplete="if (!args.validationFailed) {
                            PF('dlgMetodoPago2').hide();
                            if (args.tieneCredito) {
                                PF('dlgAplicarCredito2').show();
                            } else {
                                PF('dlgPagoTarjeta2').show();
                            }
                        }"
                                 style="background:#17a2b8; color:#fff;">
                    <f:param name="proximo" value="dlgPagoTarjeta2" />
                </p:commandButton>

            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Confirmar Crédito" widgetVar="dlgAplicarCredito2"
                  modal="true" resizable="false" closable="false" draggable="false" width="420">

            <h:panelGrid id="panelAplicarCredito2" columns="1" style="width:100%; text-align:center;">
                <p:messages id="msgsCredito2" showDetail="true" closable="true"/>

                <h:outputText value="El cliente tiene un crédito disponible de:"
                              style="font-size:16px;"/>

                <h:outputText value="#{RealizarPagoBeanUI.cliente.credito}"
                              style="font-size:22px; font-weight:bold; color:#28a745; margin:5px 0;">
                    <f:convertNumber type="currency" currencySymbol="$"/>
                </h:outputText>

                <h:outputText value="Total actual de la compra:"
                              style="font-size:16px; margin-top:10px;"/>
                <h:outputText value="#{RealizarPagoBeanUI.montoTotal}"
                              style="font-size:18px; font-weight:bold;">
                    <f:convertNumber type="currency" currencySymbol="$"/>
                </h:outputText>

                <h:outputText value="¿Desea aplicar el crédito a esta compra?"
                              style="font-size:16px; margin-top:15px; font-weight:bold;"/>

                <h:outputText value="Esta acción es irreversible y modificará el saldo del cliente."
                              style="font-size:13px; font-style:italic; color:#777;"/>

                <p:commandButton value="Sí, Aplicar Crédito"
                                 icon="pi pi-check"
                                 action="#{RealizarPagoBeanUI.aplicarCredito}"
                                 process="@this"
                                 update="panelAplicarCredito2 msgsCredito2 :formPrincipal:panelPagoTarjeta2 :formPrincipal:panelPagoInteractivo2"
                                 oncomplete="if (!args.validationFailed) { PF('dlgAplicarCredito2').hide(); PF('#{RealizarPagoBeanUI.siguienteDialogo}').show(); }"
                                 style="background:#28a745; color:#fff;"/>

                <p:commandButton value="No, Pagar Completo"
                                 icon="pi pi-times"
                                 type="button"
                                 onclick="PF('dlgAplicarCredito2').hide(); PF('#{RealizarPagoBeanUI.siguienteDialogo}').show();"
                                 style="background:#dc3545; color:#fff;"/>

            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Pago con Tarjeta"
                  widgetVar="dlgPagoTarjeta2"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="420">

            <h:panelGrid id="panelPagoTarjeta2" columns="1" style="width:100%;">
                <p:messages id="msgsTarjeta2" showDetail="true" closable="true"/>

                <h:outputText value="Información del Cliente:" style="font-weight:bold; margin-bottom:10px;"/>

                <h:panelGrid columns="2" columnClasses="label,value" style="width:100%;">
                    <h:outputText value="ID Cliente:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.cliente.idCliente}" style="color:#000000;"/>

                    <h:outputText value="Nombre del cliente:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.cliente.nombreCompleto}" style="color:#000000;"/>

                    <h:outputText value="Monto Total:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.montoTotal}" style="color:#000000;"/>

                    <h:outputText value="Fecha:" style="color:#000000;"/>
                    <h:outputText value="#{RealizarPagoBeanUI.fecha}" style="color:#000000;">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                    </h:outputText>

                    <h:outputText value="Método de pago:"/>
                    <h:outputText value="Tarjeta de crédito/débito" style="color:#17a2b8; font-weight:bold;"/>
                </h:panelGrid>

                <h:outputText value="Por favor, realice el cobro manual en la terminal bancaria."
                              style="margin-top:10px; display:block; text-align:center; font-style:italic;"/>

                <h:panelGroup layout="block" style="margin-top:15px; text-align:center;">
                    <p:commandButton id="btnPagoTarjeta2"
                                     value="Pagar"
                                     process="@this"
                                     update="msgsTarjeta2"
                                     actionListener="#{RealizarPagoBeanUI.realizarPagoTarjetaClase()}"/>

                    <p:commandButton value="Cancelar"
                                     icon="pi pi-times"
                                     actionListener="#{RealizarPagoBeanUI.limpiarCampos()}"
                                     update="@form"
                                     process="@this"
                                     oncomplete="PF('dlgPagoTarjeta2').hide();"
                                     style="background:#dc3545; color:#fff;"/>
                </h:panelGroup>
            </h:panelGrid>
        </p:dialog>

        <p:dialog id="dlgExitoTarjeta2"
                  header="Pago Realizado"
                  widgetVar="dlgExitoTarjeta2"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="300">

            <h:panelGrid columns="1" style="width:100%; text-align:center;">
                <h:outputText value="Pago realizado con éxito"
                              style="font-weight:bold; font-size:18px; color:#28a745;"/>

                <h:outputText value="El cobro con tarjeta se procesó correctamente."
                              style="font-size:14px; color:#333; margin-top:10px;"/>

                <p:commandButton value="Continuar"
                                 icon="pi pi-check"
                                 actionListener="#{RealizarPagoBeanUI.limpiarCampos()}"
                                 onclick="PF('dlgExitoTarjeta2').hide();"
                                 update="@form"
                                 style="margin-top:15px; background:#28a745; color:#fff; width:100%;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Realizar Pago en Efectivo"
                  widgetVar="dlgPagoInteractivo2"
                  modal="true"
                  resizable="false"
                  closable="true"
                  draggable="false"
                  width="400">

            <h:panelGrid id="panelPagoInteractivo2" columns="1" style="width:100%;">
                <p:messages id="msgsPagoInteractivo2" showDetail="true" closable="true"/>

                <div class="form-group">
                    <h:outputLabel for="montoIngresado2" value="Monto ingresado"/>
                    <p:inputNumber id="montoIngresado2"
                                   value="#{RealizarPagoBeanUI.montoIngresado}"
                                   minValue="0"
                                   decimalPlaces="2"
                                   style="width: 100%;">
                        <p:ajax event="keyup" update="faltante2" process="@this"/>
                    </p:inputNumber>
                </div>

                <div class="form-group">
                    <h:outputLabel value="Monto restante"/>
                    <h:outputText id="faltante2" value="#{RealizarPagoBeanUI.montoFaltante}"/>
                </div>

                <p:commandButton value="Pagar"
                                 action="#{RealizarPagoBeanUI.realizarPagoInteractivoClase()}"
                                 update="msgsPagoInteractivo2 faltante2"
                                 styleClass="ui-button"
                                 process="@this montoIngresado2"
                                 style="background:#28a745; color:#fff;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog id="dlgCambio2"
                  header="Cambio Entregado"
                  widgetVar="dlgCambio2"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="300">

            <h:panelGrid columns="1" style="width:100%; text-align:center;">
                <h:outputText value="Cambio:" style="font-weight:bold; font-size:18px;"/>
                <h:outputText value="$#{RealizarPagoBeanUI.montoCambio}"
                              style="font-size:22px; color:#28a745; margin:10px 0; display:block;">
                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                </h:outputText>

                <p:commandButton value="Continuar"
                                 icon="pi pi-check"
                                 actionListener="#{RealizarPagoBeanUI.limpiarCampos()}"
                                 onclick="PF('dlgCambio2').hide();"
                                 update="@form"
                                 style="margin-top:10px; background:#28a745; color:#fff; width:100%;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Caja"
                  widgetVar="dlgCaja"
                  modal="true"
                  resizable="false"
                  draggable="false"
                  closable="true"
                  width="380">

            <h:form id="formCaja">
                <div class="dialog-buttons">
                    <p:commandButton value="Aceptar pago por adelantado"
                                     icon="pi pi-check-circle"
                                     onclick="PF('dlgBuscarClienteAdelanto').show(); PF('dlgCaja').hide(); return false;"
                                     type="button"
                                     style="background:#007bcb; color:#fff;"/>

                    <p:commandButton value="Especificar con cuánto dinero inicia el corte"
                                     icon="pi pi-clock"
                                     actionListener="#{inicioCajaBeanUI.limpiar()}"
                                     oncomplete="PF('dlgMontoApertura').show(); PF('dlgCaja').hide();"
                                     process="@this"
                                     update="@none"
                                     style="background:#28a745; color:#fff;"/>


                    <p:commandButton value="Tomar dinero de caja"
                                     icon="pi pi-dollar"
                                     actionListener="#{retirarDineroPagaBeanUI.limpiar()}"
                                     oncomplete="PF('dlgMontoRetiro').show(); PF('dlgCaja').hide();"
                                     process="@this"
                                     update="@none"
                                     style="background:#dc3545; color:#fff;"/>
                </div>
            </h:form>
        </p:dialog>

        <p:dialog header="Buscar Cliente" widgetVar="dlgBuscarClienteAdelanto"
                  modal="true" resizable="false" closable="true" width="380">
            <h:form id="formBuscarClienteAdelanto">
                <p:messages id="msgsBuscarCliente" showDetail="true" closable="true"/>
                <h:panelGrid columns="1" style="width:100%;">

                    <h:outputLabel for="idClienteAdelanto" value="ID Cliente"/>
                    <p:inputText id="idClienteAdelanto"
                                 value="#{adelantarPagoBeanUI.idCliente}"
                                 placeholder="Ej. CLI0001"
                                 required="true"
                                 requiredMessage="El ID del cliente es obligatorio."
                                 style="width:100%;"/>

                    <p:commandButton value="Buscar"
                                     icon="pi pi-search"
                                     actionListener="#{adelantarPagoBeanUI.buscarCliente}"
                                     process="@form"
                                     update="msgsBuscarCliente :formPrincipal:formMontoAdelanto"
                                     style="margin-top:10px; background:#007bcb; color:#fff;"/>
                </h:panelGrid>
            </h:form>
        </p:dialog>

        <p:dialog header="Monto a Adelantar" widgetVar="dlgMontoAdelanto"
                  modal="true" resizable="false" closable="true" width="380">
            <h:form id="formMontoAdelanto">
                <p:messages id="msgsMontoAdelanto" showDetail="true" closable="true"/>
                <h:panelGrid columns="1" style="width:100%;">
                    <h:outputLabel for="montoAdelantado" value="Monto"/>
                    <p:inputNumber id="montoAdelantado"
                                   value="#{adelantarPagoBeanUI.montoAdelantado}"
                                   symbol="$"
                                   minValue="1"
                                   required="true" requiredMessage="El monto es obligatorio."
                                   style="width: 100%;"/>

                    <p:commandButton value="Registrar Adelanto"
                                     icon="pi pi-check"
                                     actionListener="#{adelantarPagoBeanUI.registrarAdelanto}"
                                     process="@form"  update="msgsMontoAdelanto"
                                     style="margin-top:10px; background:#28a745; color:#fff;"/>
                </h:panelGrid>
            </h:form>
        </p:dialog>

        <p:dialog header="Confirmación" widgetVar="dlgConfirmacionAdelanto"
                  modal="true" resizable="false" closable="true" width="360">
            <h:form>
                <h:outputText value="El pago por adelantado se ha registrado exitosamente."
                              style="display:block; text-align:center; margin:15px 0; font-weight:bold;"/>
                <p:commandButton value="Aceptar"
                                 icon="pi pi-check-circle"
                                 onclick="PF('dlgConfirmacionAdelanto').hide();"
                                 type="button"
                                 style="width:100%; background:#007bcb; color:#fff;"/>
            </h:form>

        </p:dialog>

        <p:dialog header="Monto a Retirar" widgetVar="dlgMontoRetiro"
                  modal="true" resizable="false" closable="true" width="380">
            <h:form id="formMontoRetirar">
                <p:messages id="msgsMontoRetiro" showDetail="true" closable="true"/>
                <h:panelGrid columns="1" style="width:100%;">
                    <h:outputLabel for="montoRetirado" value="Monto"/>
                    <p:inputNumber id="montoRetirado"
                                   value="#{retirarDineroPagaBeanUI.montoRetirar}"
                                   symbol="$"
                                   minValue="1"
                                   required="true" requiredMessage="El monto es obligatorio."
                                   style="width: 100%;"/>

                    <h:outputLabel for="obsRetiro" value="Observaciones" style="margin-top:10px; display:block;"/>
                    <p:inputTextarea id="obsRetiro"
                                     value="#{retirarDineroPagaBeanUI.observaciones}"
                                     rows="3"
                                     placeholder="Motivo del retiro..."
                                     style="width:100%; resize:none;"
                                     maxlength="250"/>

                    <p:commandButton value="Registrar Retiro"
                                     icon="pi pi-arrow-down"
                                     actionListener="#{retirarDineroPagaBeanUI.registrarRetiro}"
                                     process="@this montoRetirado obsRetiro"
                                     update="msgsMontoRetiro :formPagos"
                                     style="margin-top:10px; background:#dc3545; color:#fff;"/>
                </h:panelGrid>
            </h:form>
        </p:dialog>

        <p:dialog header="Confirmación" widgetVar="dlgConfirmacionRetiro"
                  modal="true" resizable="false" closable="true" width="360">
            <h:outputText value="El retiro de caja se ha registrado exitosamente."
                          style="display:block; text-align:center; margin:15px 0; font-weight:bold;"/>
            <p:commandButton value="Aceptar"
                             icon="pi pi-check-circle"
                             onclick="PF('dlgConfirmacionRetiro').hide();"
                             type="button"
                             style="width:100%; background:#007bcb; color:#fff;"/>
        </p:dialog>

        <p:dialog header="Monto de Apertura de Caja"
                  widgetVar="dlgMontoApertura"
                  modal="true"
                  resizable="false"
                  closable="true"
                  draggable="false"
                  width="360">

            <h:form id="formMontoApertura">
                <h:panelGrid columns="1" style="width:100%;">
                    <p:messages id="msgsMontoApertura" showDetail="true" closable="true"/>

                    <div class="form-group">
                        <h:outputLabel for="montoApertura" value="Monto Inicial en Caja"/>
                        <p:inputNumber id="montoApertura"
                                       value="#{inicioCajaBeanUI.montoEnCaja}"
                                       symbol="$"
                                       symbolPosition="p"
                                       minValue="0"
                                       styleClass="form-control"
                                       required="true"
                                       requiredMessage="Debe ingresar el monto de apertura"/>
                    </div>

                    <p:commandButton value="Registrar Apertura"
                                     icon="pi pi-check"
                                     action="#{inicioCajaBeanUI.registrarAperturaCaja}"
                                     update="msgsMontoApertura formPagos:tablaPagos"
                                     process="@form"
                                     style="background:#28a745; color:#fff;"/>
                </h:panelGrid>
            </h:form>
        </p:dialog>


    </h:form>

</h:body>
</html>
