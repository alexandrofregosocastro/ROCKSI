<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Productos - Rock On</title>
    <meta charset="UTF-8"/>

    <style>
        body {
            margin: 0;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #f8f9fb;
        }

        /* BARRA LATERAL */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #007bcb;
            color: white;
            position: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Menú principal dentro de la barra lateral */
        .sidebar .menu {
            width: 100%;
            padding-top: 30px;
        }

        /* Enlaces del menú  */
        .sidebar a,
        .sidebar h\:commandLink {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white !important;
            text-decoration: none !important;
            padding: 10px 20px;
            font-size: 15px;
            transition: background 0.3s, transform 0.2s;
            margin-bottom: 10px;
        }

        /* Hover y estado activo */
        .sidebar a:hover,
        .sidebar h\:commandLink:hover,
        .sidebar .active {
            background: #0061a6 !important;
            border-radius: 6px;
        }

        /* Ícono dentro del menú */
        .menu-icon {
            width: 22px;
            height: 22px;
            filter: brightness(0) invert(1);
            transition: transform 0.2s ease;
        }

        /* Animación de ícono al pasar el mouse */
        .sidebar h\:commandLink:hover .menu-icon {
            transform: scale(1.15);
        }

        /* Logo inferior */
        .sidebar .logo-bottom {
            padding: 25px 0;
        }

        .sidebar .logo-bottom img {
            width: 130px;
            border-radius: 50%;
        }

        /* ESTILOS GENERALES */
        body {
            margin: 0;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #f8f9fb;
        }

        /* CONTENEDOR PRINCIPAL */
        .main-content {
            margin-left: 220px;
            padding: 30px 40px;
        }

        /* Encabezado de la página (título "Clases") */
        .header-clientes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #007bcb;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .header-clientes h1 {
            font-size: 26px;
            color: #000;
            margin: 0;
            font-weight: 700;
        }

        /* TARJETA CONTENEDORA */
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* BOTONES DE ACCIÓN */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .action-buttons .ui-button {
            border: none !important;
            border-radius: 20px !important;
            font-weight: 600 !important;
            padding: 6px 16px !important;
            font-size: 14px !important;
        }

        .btn-registrar {
            background: #007bcb !important;
            color: #fff !important;
        }

        .btn-modificar {
            background: #007bcb !important;
            color: #fff !important;
        }

        .btn-baja {
            background: #007bcb !important;
            color: #fff !important;
        }

        /* TABLA DE PRODUCTOS */
        .ui-datatable {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: none !important;
            margin-top: 5px;
        }

        .ui-datatable thead th {
            background-color: #007bcb !important;
            color: white !important;
            text-align: left !important;
            font-weight: 600 !important;
            padding: 10px 12px !important;
            border: none !important;
            font-size: 14px !important;
        }

        .ui-datatable tbody td {
            padding: 10px 12px !important;
            font-size: 14px !important;
            color: #222;
            border: none !important;
        }

        .ui-datatable tr:nth-child(even) {
            background-color: #f9f9f9 !important;
        }

        .ui-datatable tr:nth-child(odd) {
            background-color: #fff !important;
        }

        .ui-datatable tr:hover {
            background-color: #eef7ff !important;
        }

        .ui-datatable-tablewrapper {
            border-radius: 10px;
            overflow: hidden;
        }

        /* Boton cerrar */
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-focus {
            background: transparent !important;
            border: none !important;
            color: #555 !important;
            position: absolute !important;
            right: 10px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            transition: all 0.3s ease !important;
            box-shadow: none !important;
        }

        /* Boton cerrar on hover*/
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close:hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover:hover {
            background-color: #dc3545 !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 28px !important;
            height: 28px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        /* Titulo del modal */
        .ui-dialog-title {
            width: 100% !important;
            text-align: center !important;
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #000 !important;
        }

        /* Contenido del modal */
        .form-group {
            background-color: #fff;
            border-radius: 15px;
            border: none;
            color: #000;
            padding: 20px;
        }

        /* Configracion del layout del modal */
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            width: 90%;
        }

        /* Configracion del layout del modal */
        .form-group label {
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .ui-dialog {
            background: white !important;
            border-radius: 15px !important;
            border: none !important;
        }

        /* Configuracion del titulo del modal */
        .ui-dialog-titlebar {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            position: relative;
            background: white !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .form-group {
            background: white !important;
            border: none !important;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .form-group {
            border: none;
            border-bottom: 2px solid #ccc;
            border-radius: 0;
            background: transparent;
            color: #000;
            font-size: 15px;
        }

        /* Configuracion de estilo en los campos cuando se aplica un focus*/
        .form-group:focus,
        .form-group:focus {
            border-color: #919191 !important;
            outline: none !important;
        }

        /* Configuracion en del boton registrar cliente*/
        .boton-registrar {
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 15px auto 0 auto !important;
            width: 80% !important;
        }

        /* Configuracion en del boton registrar cliente*/
        .boton-registrar {
            margin-right: 8px;
            font-size: 16px;
        }

        .ui-confirmdialog {
            z-index: 1100 !important;
        }

        .ui-widget-overlay {
            z-index: 1000 !important;
        }

        /* === NUEVAS TABLAS (Productos / Lista de artículos a cobrar) === */
        .tienda-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        /* Contenedores de cada tabla */
        .tienda-box {
            flex: 1;
            min-width: 400px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            padding: 20px 25px;
        }

        /* Encabezado de cada bloque */
        .tienda-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            margin: 0 0 10px 0;
        }

        /* Input de búsqueda */
        .tienda-box input[type="text"],
        .tienda-box .ui-inputfield {
            width: 100% !important;
            border: 1px solid #ccc !important;
            border-radius: 6px !important;
            padding: 8px 10px !important;
            font-size: 14px !important;
            box-shadow: none !important;
            margin-bottom: 12px !important;
            transition: border-color 0.2s;
        }
        .tienda-box input[type="text"]:focus,
        .tienda-box .ui-inputfield.ui-state-focus {
            border-color: #007bcb !important;
        }

        /* Tablas internas */
        .tienda-box .ui-datatable {
            width: 100% !important;
            border-radius: 8px !important;
            border: none !important;
            overflow: hidden !important;
        }

        .tienda-box .ui-datatable thead th {
            background-color: #f4f6f8 !important;
            color: #000 !important;
            text-align: left !important;
            font-weight: 600 !important;
            padding: 8px 12px !important;
            border-bottom: 2px solid #e0e0e0 !important;
            font-size: 14px !important;
        }

        .tienda-box .ui-datatable tbody td {
            padding: 10px 12px !important;
            font-size: 14px !important;
            color: #333;
            border-bottom: 1px solid #f0f0f0 !important;
        }

        /* Hover de fila */
        .tienda-box .ui-datatable tbody tr:hover {
            background-color: #eef7ff !important;
        }

        /* Bloque de total */
        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #007bcb;
            color: white;
            padding: 10px 16px;
            margin-top: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
        }

        /* Botón de Cobrar */
        .btn-cobrar {
            margin-top: 12px;
            background: #007bcb !important;
            color: white !important;
            border: none !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            padding: 8px 18px !important;
            float: right;
            transition: all 0.2s ease-in-out;
        }
        .btn-cobrar:hover {
            background: #005c96 !important;
            transform: scale(1.05);
        }

        /* Encabezado de la sección "Productos" con buscador en la misma línea */
        .header-tienda {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        /* Título */
        .header-tienda h2 {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            margin: 0;
        }

        /* Campo de búsqueda */
        .buscar-producto {
            width: 220px !important;
            border: 2px solid #d8d8d8 !important;
            border-radius: 8px !important;
            padding: 8px 10px !important;
            font-size: 14px !important;
            box-shadow: none !important;
            transition: all 0.2s ease;
        }
        .buscar-producto:focus,
        .buscar-producto.ui-state-focus {
            border-color: #007bcb !important;
        }

        /* 1. Anula el padding y margen muy grande denrtro de cualquier dialogo */
        .ui-dialog .form-group {
            padding: 0 !important;
            margin-bottom: 12px !important;
            background: none !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;

            /* Mantenemos la estructura flex, pero con ancho completo */
            display: flex;
            flex-direction: column;
            width: 100% !important;
        }

        /* Espacio para todos los espacios entre label e input */
        .ui-dialog .form-group label {
            margin-bottom: 5px;
        }

        .ui-dialog .ui-panelgrid td {
            padding: 6px 4px !important;
            border: none !important;
        }

        /* Asegura que los panelgrids no tengan espaciado de borde */
        .ui-dialog .ui-panelgrid {
            border-collapse: collapse;
        }

        /* Añade un pequeño espacio entre botones si estan apilados */
        .ui-dialog .ui-button {
            margin-top: 5px;
        }


        .sidebar-footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
        }

        .sidebar-footer form {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .logout-link {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            color: white !important;
            text-decoration: none !important;
            padding: 10px 20px !important;
            font-size: 15px !important;
            transition: background 0.3s, transform 0.2s !important;
            width: 100% !important;
            box-sizing: border-box !important;
            cursor: pointer;
            border-radius: 0 !important;
        }

        .logout-link:hover {
            background: #0061a6 !important;
        }

        .logout-icon {
            width: 22px;
            height: 22px;
            font-size: 1.2rem;
        }
    </style>
</h:head>

<h:body>
    <div class="sidebar">
        <div class="menu">
            <h:form>
                <h:commandLink action="home.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('home')}"
                               styleClass="#{menuBeanUI.activePage eq 'home' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/home.png" alt="Home Icon" class="menu-icon"/>
                    <span>Home</span>
                </h:commandLink>

                <h:commandLink action="clientes.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clientes')}"
                               styleClass="#{menuBeanUI.activePage eq 'clientes' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clientes.png" alt="Clientes Icon" class="menu-icon"/>
                    <span>Clientes</span>
                </h:commandLink>

                <h:commandLink action="tienda.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('tienda')}"
                               styleClass="#{menuBeanUI.activePage eq 'tienda' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/tienda.png" alt="Tienda Icon" class="menu-icon"/>
                    <span>Tienda</span>
                </h:commandLink>

                <h:commandLink action="clases.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clases')}"
                               styleClass="#{menuBeanUI.activePage eq 'clases' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clases.png" alt="Clases Icon" class="menu-icon"/>
                    <span>Clases</span>
                </h:commandLink>

                <h:commandLink action="pagos.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('pagos')}"
                               styleClass="#{menuBeanUI.activePage eq 'pagos' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/pagos.png" alt="Pagos Icon" class="menu-icon"/>
                    <span>Pagos</span>
                </h:commandLink>
                <h:commandLink action="usuarios.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('usuarios')}"
                               styleClass="#{menuBeanUI.activePage eq 'usuarios' ? 'active' : ''}" rendered="#{loginBeanUI.isAdmin()}"> <img src="resources-20250903T164359Z-1-001/resources/clientes.png" alt="Usuarios Icon" class="menu-icon"/>
                    <span>Usuarios</span>
                </h:commandLink>
            </h:form>
        </div>

        <div class="sidebar-footer">

            <h:form>
                <h:commandLink action="#{loginBeanUI.cerrarSesion}" styleClass="logout-link">
                    <i class="pi pi-power-off logout-icon"></i>
                    <span>Cerrar Sesión</span>
                </h:commandLink>
            </h:form>

            <div class="logo-bottom">
                <img src="resources-20250903T164359Z-1-001/resources/rockon-icon.png" alt="Rock On Logo"/>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <h:form id="formProductos">
                <h1>Productos</h1>

                <div class="tienda-container">

                    <div class="tienda-box">
                        <div class="header-tienda">
                            <h2>Productos</h2>
                            <p:inputText id="buscarProducto"
                                         value="#{productoBeanUI.filtro}"
                                         placeholder="Buscar por ID"
                                         styleClass="form-control buscar-producto">
                                <p:ajax event="input"
                                        listener="#{productoBeanUI.filtrarPorId}"
                                        update="tablaProductosMini"
                                        delay="300"/>
                            </p:inputText>
                        </div>

                        <p:growl id="msgs" showDetail="true" life="3000" />

                        <p:dataTable id="tablaProductosMini"
                                     value="#{productoBeanUI.listaProductos}"
                                     var="pro"
                                     paginator="false"
                                     emptyMessage="No hay productos registrados">

                            <p:column headerText="ID" width="60">
                                <h:outputText value="#{pro.idItem}" />
                            </p:column>
                            <p:column headerText="Nombre">
                                <h:outputText value="#{pro.nombre}" />
                            </p:column>
                            <p:column headerText="Precio" width="80">
                                <h:outputText value="$#{pro.precio}" />
                            </p:column>
                            <p:column headerText="Stock" width="60" style="text-align: center;">
                                <h:outputText value="#{pro.stock}" />
                            </p:column>

                            <p:column headerText="Agregar" width="80" style="text-align: center;">
                                <p:commandButton icon="pi pi-plus"
                                                 actionListener="#{tiendaBeanUI.agregarAListaArticulos(pro)}"
                                                 update=":formProductos:tablaCarrito :formProductos:tablaProductosMini :formProductos:totalBox :formProductos:msgs"
                                                 style="background:#007bcb !important; border:none; border-radius:50%; width:2.5rem; height:2.5rem;"
                                                 title="Agregar a la lista de artículos a cobrar"/>
                            </p:column>
                        </p:dataTable>
                    </div>

                    <div class="tienda-box">
                        <h2>Lista de artículos a cobrar</h2>

                        <p:dataTable id="tablaCarrito"
                                     value="#{tiendaBeanUI.listaArticulos}"
                                     var="item"
                                     paginator="false"
                                     emptyMessage="Tu lista de artículos a cobrar está vacía">

                            <p:column headerText="Nombre">
                                <h:outputText value="#{item.nombre}" />
                            </p:column>
                            <p:column headerText="Precio" width="80">
                                <h:outputText value="$#{item.precio}" />
                            </p:column>

                            <p:column headerText="Cantidad" width="140" style="text-align: center;">
                                <div style="display: flex; justify-content: center; align-items: center; gap: 8px;">

                                    <p:commandButton icon="pi pi-minus"
                                                     actionListener="#{tiendaBeanUI.disminuirCantidad(item)}"
                                                     update=":formProductos:tablaCarrito :formProductos:tablaProductosMini :formProductos:totalBox"
                                                     style="background:#6c757d !important; border:none; border-radius:4px; width:2rem; height:2rem; padding:0;"/>

                                    <h:outputText value="#{item.cantidad}" style="font-weight: bold; font-size: 16px; width: 20px; text-align: center;"/>

                                    <p:commandButton icon="pi pi-plus"
                                                     actionListener="#{tiendaBeanUI.aumentarCantidad(item)}"
                                                     update=":formProductos:tablaCarrito :formProductos:tablaProductosMini :formProductos:totalBox :formProductos:msgs"
                                                     style="background:#007bff !important; border:none; border-radius:4px; width:2rem; height:2rem; padding:0;"/>

                                    <p:commandButton icon="pi pi-trash"
                                                     actionListener="#{tiendaBeanUI.eliminarDeListaArticulos(item)}"
                                                     update=":formProductos:tablaCarrito :formProductos:tablaProductosMini :formProductos:totalBox"
                                                     style="background:#dc3545 !important; border:none; border-radius:4px; width:2rem; height:2rem; padding:0; margin-left: 5px;"
                                                     title="Quitar de la lista de artículos a cobrar"/>
                                </div>
                            </p:column>
                        </p:dataTable>

                        <h:panelGroup id="totalBox" layout="block" styleClass="total-box">
                            <span>Total:</span>
                            <h:outputText value="#{tiendaBeanUI.total}">
                                <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2" />
                            </h:outputText>
                        </h:panelGroup>

                        <p:commandButton value="Cobrar"
                                         icon="pi pi-check"
                                         actionListener="#{tiendaBeanUI.validarListaArticulos()}"
                                         oncomplete="if (!args.validationFailed) { PF('dlgMetodoPago1').show(); }"
                                         update="tablaCarrito totalBox msgs"
                                         styleClass="btn-cobrar" />
                    </div>

                </div>

                <h:panelGroup layout="block" styleClass="action-buttons" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;" rendered="#{loginBeanUI.isAdmin()}">
                    <h:outputLabel for="txtFiltroProducto" value="ID Producto:"/>
                    <p:inputText id="txtFiltroProducto"
                                 value="#{productoBeanUI.filtro}"
                                 placeholder="Buscar producto"
                                 styleClass="form-control"
                                 style="width:220px;">
                        <p:ajax event="input"
                                listener="#{productoBeanUI.filtrarPorId}"
                                update="tablaProductos"
                                delay="300"/>
                    </p:inputText>

                    <p:commandButton value="Actualizar Tabla" icon="pi pi-refresh"
                                     action="#{productoBeanUI.recargar}"
                                     update="tablaProductos"
                                     styleClass="btn-registrar"/>

                    <p:commandButton value="Alta de Producto" icon="pi pi-plus"
                                     styleClass="btn-registrar"
                                     onclick="PF('dlgAgregarProducto').show(); return false;"
                                     type="button"/>

                    <p:commandButton value="Modificar Producto" icon="pi pi-pencil" styleClass="btn-modificar"
                                     onclick="PF('dlgBuscarProd').show(); return false;" type="button"/>

                    <p:commandButton value="Baja de Producto" icon="pi pi-trash" styleClass="btn-baja"
                                     onclick="PF('dlgEliminarProducto').show(); return false;" type="button"/>

                </h:panelGroup>

                <p:dataTable id="tablaProductos" value="#{productoBeanUI.listaProductos}" var="pro"
                             paginator="true" rows="8" emptyMessage="No hay productos registrados"
                             paginatorPosition="bottom" style="margin-top:20px;" rendered="#{loginBeanUI.isAdmin()}">
                    <p:column headerText="ID Producto" sortBy="#{pro.idItem}">
                        <h:outputText value="#{pro.idItem}"/>
                    </p:column>
                    <p:column headerText="Nombre" sortBy="#{pro.nombre}">
                        <h:outputText value="#{pro.nombre}"/>
                    </p:column>
                    <p:column headerText="Stock" sortBy="#{pro.stock}">
                        <h:outputText value="#{pro.stock}"/>
                    </p:column>
                    <p:column headerText="Precio por unidad" sortBy="#{pro.precio}">
                        <h:outputText value="#{pro.precio}"/>
                    </p:column>
                    <p:column headerText="Proveedor" sortBy="#{pro.proveedor}">
                        <h:outputText value="#{pro.proveedor}"/>
                    </p:column>

                    <p:column headerText="Acciones" style="width:120px; text-align:center;">
                        <p:commandButton icon="pi pi-pencil"
                                         title="Modificar"
                                         styleClass="btn-modificar"
                                         style="margin-right:5px;"
                                         actionListener="#{modificarProdBeanUI.cargarProductoDesdeTabla(pro)}"
                                         process="@this"
                                         update="formModificarProd"
                                         oncomplete="PF('dlgModificarProd').show();"/>

                        <p:commandButton icon="pi pi-trash"
                                         title="Eliminar"
                                         styleClass="btn-baja"
                                         actionListener="#{bajaProductoBeanUI.prepararEliminacion(pro.idItem)}"
                                         process="@this"
                                         oncomplete="PF('dlgConfirmarProductoTabla').show();"
                                         style="margin-left:5px;"/>
                    </p:column>
                </p:dataTable>
            </h:form>
        </div>
    </div>
    <p:dialog header="Nuevo producto" widgetVar="dlgAgregarProducto" modal="true"
              resizable="false" closable="true" draggable="false" width="360" rendered="#{loginBeanUI.isAdmin()}"> <h:form id="formAltaProducto">

        <div class="form-group">
            <h:outputLabel for="nombreProducto" value="Nombre"/>
            <p:inputText id="nombreProducto"
                         value="#{altaProdBeanUI.nombre}"
                         placeholder="Nombre"
                         required="true"
                         requiredMessage="El campo Nombre es obligatorio"/>
        </div>

        <div class="form-group">
            <h:outputLabel for="stockProducto" value="Stock"/>
            <p:inputNumber id="stockProducto"
                           value="#{altaProdBeanUI.stock}"
                           placeholder="Existencia del producto"
                           minValue="1" decimalPlaces="0"
                           required="true"
                           requiredMessage="El campo Stock es obligatorio"
                           style="width: 100%;">
            </p:inputNumber>
        </div>

        <div class="form-group">
            <h:outputLabel for="precioProducto" value="Precio"/>
            <p:inputNumber id="precioProducto"
                           value="#{altaProdBeanUI.precio}"
                           placeholder="Precio del producto"
                           minValue="0.01" decimalPlaces="2"
                           required="true"
                           requiredMessage="El campo Precio es obligatorio"
                           style="width: 100%;">
            </p:inputNumber>
        </div>

        <div class="form-group">
            <h:outputLabel for="proveedorProducto" value="Proveedor"/>
            <p:inputText id="proveedorProducto"
                         value="#{altaProdBeanUI.proveedor}"
                         placeholder="Ej. cocacola, nestle"
                         required="true"
                         requiredMessage="El campo Proveedor es obligatorio"/>
        </div> <div class="boton-registrar">
        <p:commandButton id="registrarProductoBtn"
                         value="Registrar el producto"
                         icon="pi pi-plus-circle"
                         action="#{altaProdBeanUI.altaProducto}"
                         process="@form"
                         update="@form formProductos:tablaProductos :formProductos:tablaProductosMini :formProductos:msgs"
                         style="background:#007bff; color:#fff; border:none;"/>
    </div>
    </h:form>
    </p:dialog>

    <p:dialog header="Buscar producto" widgetVar="dlgBuscarProd"
              modal="true" resizable="false" draggable="false" closable="true"
              width="380" rendered="#{loginBeanUI.isAdmin()}"> <h:form id="formBuscarProd">
        <p:messages id="msgsAsk" showDetail="true" closable="true" />

        <div class="form-group" style="margin-top: 10px;">
            <h:outputLabel for="busquedaId" value="ID del producto:"/>
            <p:inputText id="busquedaId"
                         value="#{modificarProdBeanUI.busquedaId}"
                         placeholder="Ejemplo: PR1001"
                         style="width:100%" required="true"
                         requiredMessage="Debe ingresar un ID."/>
        </div>

        <div style="text-align:center; margin-top:1em;">
            <p:commandButton value="Buscar"
                             icon="pi pi-search"
                             action="#{modificarProdBeanUI.cargarProductoPorId}"
                             update="formBuscarProd:msgsAsk, formModificarProd"
                             oncomplete="if (args &amp;&amp; args.found){PF('dlgBuscarProd').hide();PF('dlgModificarProd').show();}"/>
        </div>
    </h:form>
    </p:dialog>

    <p:dialog header="Modificar producto" widgetVar="dlgModificarProd"
              modal="true" resizable="false" draggable="false" closable="true"
              width="420" rendered="#{loginBeanUI.isAdmin()}"> <h:form id="formModificarProd">
        <p:messages id="msgsModificar" showDetail="true" closable="true" />

        <h:panelGrid columns="1" cellpadding="5" style="width:100%;">

            <h:outputLabel for="nombre" value="Nombre"/>
            <p:inputText id="nombre" value="#{modificarProdBeanUI.nombre}"
                         placeholder="Nombre del producto" style="width:100%" required="true"
                         requiredMessage="El nombre es obligatorio."/>

            <h:outputLabel for="stock" value="Stock"/>
            <p:inputNumber id="stock" value="#{modificarProdBeanUI.stock}"
                           placeholder="Existencia del producto" style="width:100%"
                           minValue="0" required="true"
                           requiredMessage="El stock es obligatorio."/>

            <h:outputLabel for="precio" value="Precio"/>
            <p:inputNumber id="precio" value="#{modificarProdBeanUI.precio}"
                           placeholder="Precio del producto" style="width:100%"
                           decimalPlaces="2" minValue="0"
                           required="true" requiredMessage="El precio es obligatorio."/>

            <h:outputLabel for="proveedor" value="Proveedor"/>
            <p:inputText id="proveedor"
                         value="#{modificarProdBeanUI.proveedor}"
                         placeholder="Proveedor del producto"
                         style="width:100%"
                         required="true"
                         requiredMessage="El proveedor es obligatorio."/>

        </h:panelGrid>

        <div style="text-align:center; margin-top:15px;">
            <p:commandButton value="Guardar cambios"
                             icon="pi pi-check"
                             action="#{modificarProdBeanUI.modificarProducto}"
                             update="msgsModificar formBuscarProd:msgsAsk :formProductos:tablaProductos :formProductos:tablaProductosMini :formProductos:msgs"
                             oncomplete="if (!args.validationFailed) { PF('dlgModificarProd').hide(); }"/>
        </div>

        <div style="text-align:center; margin-top:10px;">
            <p:commandButton value="Cancelar"
                             icon="pi pi-times"
                             type="button"
                             onclick="PF('dlgModificarProd').hide(); PF('dlgBuscarProd').show();"/>
        </div>

    </h:form>
    </p:dialog>

    <p:dialog header="Eliminar Producto" widgetVar="dlgEliminarProducto"
              modal="true" resizable="false" closable="true"
              draggable="false" width="360" rendered="#{loginBeanUI.isAdmin()}">
        <h:form id="formEliminarProducto"> <p:messages id="msgsEliminarProducto" showDetail="true" closable="true"/>

            <div class="form-group">
                <h:outputLabel for="idEliminarProducto" value="ID del Producto"/>
                <p:inputText id="idEliminarProducto"
                             value="#{bajaProductoBeanUI.idProducto}"
                             placeholder="ID del producto a eliminar"
                             required="true"
                             requiredMessage="El campo ID es obligatorio"/>
            </div>

            <p:commandButton id="abrirConfirmarProductoBtn" value="Eliminar Producto"
                             icon="pi pi-times-circle"
                             styleClass="btn-baja"
                             actionListener="#{bajaProductoBeanUI.prepararEliminacion(bajaProductoBeanUI.idProducto)}"
                             process="@this idEliminarProducto"
                             oncomplete="PF('dlgConfirmarProductoTabla').show(); PF('dlgEliminarProducto').hide();"/>
        </h:form>
    </p:dialog>

    <p:dialog widgetVar="dlgConfirmarProductoTabla" header="Confirmar eliminación"
              modal="true" resizable="false" draggable="false"
              closable="false" width="400">

        <h:outputText value="¿Seguro que deseas eliminar este producto?"
                      style="display:block; margin-bottom:15px;"/>

            <p:commandButton value="Sí, eliminar"
                             icon="pi pi-check"
                             action="#{bajaProductoBeanUI.eliminarProducto}"
                             process="@this"
                             update=":formProductos:msgs :formProductos:tablaProductos :formProductos:tablaProductosMini"
                             oncomplete="PF('dlgConfirmarProductoTabla').hide();"
                             style="background:#007bff !important; color:#fff !important; border:none !important;"/>

                <p:commandButton value="Cancelar"
                                 icon="pi pi-times"
                                 onclick="PF('dlgConfirmarProductoTabla').hide(); return false;"
                                 type="button"
                                 style="background:#007bff !important; color:#fff !important; border:none !important; margin-left:10px;"/>
    </p:dialog>

    <h:form id="formPrincipal">
        <p:dialog header="Seleccionar Método de Pago" widgetVar="dlgMetodoPago1"
                  modal="true" resizable="false" closable="true" draggable="false" width="360">
            <h:panelGrid id="panelMetodoPago1" columns="1" style="width:100%; text-align:center;">

                <p:messages id="msgsMetodoPago1" showDetail="true" closable="true"/>

                <div class="form-group">
                    <h:outputLabel for="cliente1" value="Cliente" style="font-weight:bold;"/>
                    <p:inputText id="cliente1"
                                 value="#{tiendaBeanUI.idCliente}"
                                 maxlength="7"
                                 onkeydown="if(event.key === 'Enter'){event.preventDefault(); return false;}"
                                 placeholder="CLI1000"
                                 styleClass="form-control">
                    </p:inputText>
                </div>

                <div class="form-group">
                    <h:outputLabel for="descuento1" value="Descuento (opcional)" style="font-weight:bold;"/>
                    <p:inputNumber id="descuento1"
                                   value="#{tiendaBeanUI.descuento}"
                                   minValue="0"
                                   decimalPlaces="2"
                                   placeholder="$200"
                                   style="width: 100%;">
                    </p:inputNumber>
                </div>

                <p:commandButton value="Pago en Efectivo"
                                 icon="pi pi-money-bill"
                                 actionListener="#{tiendaBeanUI.prepararPago()}"
                                 process="@this cliente1 descuento1"
                                 update="panelMetodoPago1 :formPrincipal:panelPagoInteractivo1 :formPrincipal:panelAplicarCredito1"
                                 oncomplete="if (!args.validationFailed) {
                                PF('dlgMetodoPago1').hide();
                                if (args.tieneCredito) {
                                    PF('dlgAplicarCredito1').show();
                                } else {
                                    PF('dlgPagoInteractivo1').show();
                                }
                            }"
                                 style="background:#007bff !important; color:#fff !important; border:none !important;">
                    <f:param name="proximo" value="dlgPagoInteractivo1" />
                </p:commandButton>

                <p:commandButton value="Pago con Tarjeta"
                                 icon="pi pi-credit-card"
                                 actionListener="#{tiendaBeanUI.prepararPago()}"
                                 process="@this cliente1 descuento1"
                                 update="panelMetodoPago1 :formPrincipal:panelPagoTarjeta1 :formPrincipal:panelAplicarCredito1"
                                 oncomplete="if (!args.validationFailed) {
                                PF('dlgMetodoPago1').hide();
                                if (args.tieneCredito) {
                                    PF('dlgAplicarCredito1').show();
                                } else {
                                    PF('dlgPagoTarjeta1').show();
                                }
                            }"
                                 style="background:#007bff !important; color:#fff !important; border:none !important;">
                    <f:param name="proximo" value="dlgPagoTarjeta1" />
                </p:commandButton>

                <p:commandButton value="Pago por Pagar"
                                 icon="pi pi-book"
                                 actionListener="#{tiendaBeanUI.prepararPago()}"
                                 process="@this cliente1 descuento1"
                                 update="panelMetodoPago1 :formPrincipal:panelPagoPorPagarM :formPrincipal:panelAplicarCredito1"
                                 oncomplete="if (!args.validationFailed) {
                                PF('dlgMetodoPago1').hide();
                                if (args.tieneCredito) {
                                    PF('dlgAplicarCredito1').show();
                                } else {
                                    PF('dlgPagoPorPagarM').show();
                                }
                            }"
                                 style="background:#cf962e !important; color:#fff !important; border:none !important;">
                    <f:param name="proximo" value="dlgPagoTarjeta1" />
                </p:commandButton>

            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Confirmar Crédito" widgetVar="dlgAplicarCredito1"
                  modal="true" resizable="false" closable="false" draggable="false" width="420">

            <h:panelGrid id="panelAplicarCredito1" columns="1" style="width:100%; text-align:center;">
                <p:messages id="msgsCredito1" showDetail="true" closable="true"/>

                <h:outputText value="El cliente tiene un crédito disponible de:"
                              style="font-size:16px;"/>

                <h:outputText value="#{tiendaBeanUI.cliente.credito}"
                              style="font-size:22px; font-weight:bold; color:#28a745; margin:5px 0;">
                    <f:convertNumber type="currency" currencySymbol="$"/>
                </h:outputText>

                <h:outputText value="Total actual de la compra:"
                              style="font-size:16px; margin-top:10px;"/>
                <h:outputText value="#{tiendaBeanUI.montoTotal}"
                              style="font-size:18px; font-weight:bold;">
                    <f:convertNumber type="currency" currencySymbol="$"/>
                </h:outputText>

                <h:outputText value="¿Desea aplicar el crédito a esta compra?"
                              style="font-size:16px; margin-top:15px; font-weight:bold;"/>

                <h:outputText value="Esta acción es irreversible y modificará el saldo del cliente."
                              style="font-size:13px; font-style:italic; color:#777;"/>

                <p:commandButton value="Sí, Aplicar Crédito"
                                 icon="pi pi-check"
                                 action="#{tiendaBeanUI.aplicarCredito}"
                                 process="@this"
                                 update="panelAplicarCredito1 msgsCredito1 :formPrincipal:panelPagoTarjeta1 :formPrincipal:panelPagoInteractivo1 :formPrincipal:panelPagoPorPagarM"
                                 oncomplete="if (!args.validationFailed) { PF('dlgAplicarCredito1').hide(); PF('#{tiendaBeanUI.siguienteDialogo}').show(); }"
                                 style="background:#007bff !important; color:#fff !important; border:none !important;"/>

                <p:commandButton value="No, Pagar Completo"
                                 icon="pi pi-times"
                                 type="button"
                                 onclick="PF('dlgAplicarCredito1').hide(); PF('#{tiendaBeanUI.siguienteDialogo}').show();"
                                 style="background:#dc3545; color:#fff;"/>

            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Pago con Tarjeta"
                  widgetVar="dlgPagoTarjeta1"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="420">

            <h:panelGrid id="panelPagoTarjeta1" columns="1" style="width:100%;">
                <p:messages id="msgsTarjeta1" showDetail="true" closable="true"/>

                <h:outputText value="Información del Cliente:" style="font-weight:bold; margin-bottom:10px;"/>

                <h:panelGrid columns="2" columnClasses="label,value" style="width:100%;">
                    <h:outputText value="ID Cliente:" style="color:#000000;"/>
                    <h:outputText value="#{tiendaBeanUI.cliente.idCliente}" style="color:#000000;"/>

                    <h:outputText value="Nombre del cliente:" style="color:#000000;"/>
                    <h:outputText value="#{tiendaBeanUI.cliente.nombreCompleto}" style="color:#000000;"/>

                    <h:outputText value="Monto Total:" style="color:#000000;"/>
                    <h:outputText value="#{tiendaBeanUI.montoTotal}" style="color:#000000;"/>

                    <h:outputText value="Fecha:" style="color:#000000;"/>
                    <h:outputText value="#{tiendaBeanUI.fecha}" style="color:#000000;">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                    </h:outputText>

                    <h:outputText value="Método de pago:" style="color:#000000;"/>
                    <h:outputText value="Tarjeta de crédito/débito" style="color:#17a2b8; font-weight:bold;"/>
                </h:panelGrid>

                <h:outputText value="Por favor, realice el cobro manual en la terminal bancaria."
                              style="margin-top:10px; display:block; text-align:center; font-style:italic;"/>

                <h:panelGroup layout="block" style="margin-top:15px; text-align:center;">
                    <p:commandButton id="btnPagoTarjeta1"
                                     value="Pagar"
                                     process="@this"
                                     update="msgsTarjeta1"
                                     actionListener="#{tiendaBeanUI.realizarPagoTarjetaListaArticulos()}"
                                     style="background:#007bff !important; color:#fff !important; border:none !important;"/>

                    <p:commandButton value="Cancelar"
                                     icon="pi pi-times"
                                     actionListener="#{tiendaBeanUI.limpiarCampos()}"
                                     update="@form"
                                     process="@this"
                                     oncomplete="PF('dlgPagoTarjeta1').hide();"
                                     style="background:#dc3545; color:#fff;"/>
                </h:panelGroup>
            </h:panelGrid>
        </p:dialog>

        <p:dialog id="dlgExitoTarjeta1"
                  header="Pago Realizado"
                  widgetVar="dlgExitoTarjeta1"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="300">

            <h:panelGrid columns="1" style="width:100%; text-align:center;">
                <h:outputText value="Pago realizado con éxito"
                              style="font-weight:bold; font-size:18px; color:#28a745;"/>

                <h:outputText value="El cobro con tarjeta se procesó correctamente."
                              style="font-size:14px; color:#333; margin-top:10px;"/>

                <p:commandButton value="Continuar"
                                 icon="pi pi-check"
                                 actionListener="#{RealizarPagoBeanUI.limpiarCampos()}"
                                 onclick="PF('dlgExitoTarjeta1').hide();"
                                 update="@form"
                                 style="background:#007bff !important; color:#fff !important; border:none !important;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Realizar Pago en Efectivo"
                  widgetVar="dlgPagoInteractivo1"
                  modal="true"
                  resizable="false"
                  closable="true"
                  draggable="false"
                  width="400">

            <h:panelGrid id="panelPagoInteractivo1" columns="1" style="width:100%;">
                <p:messages id="msgsPagoInteractivo1" showDetail="true" closable="true"/>

                <div class="form-group">
                    <h:outputLabel for="montoIngresado1" value="Monto ingresado"/>
                    <p:inputNumber id="montoIngresado1"
                                   value="#{tiendaBeanUI.montoIngresado}"
                                   minValue="0"
                                   decimalPlaces="2"
                                   style="width: 100%;">
                        <p:ajax event="keyup" update="faltante1" process="@this"/>
                    </p:inputNumber>
                </div>

                <div class="form-group">
                    <h:outputLabel value="Monto restante"/>
                    <h:outputText id="faltante1" value="#{tiendaBeanUI.montoFaltante}"/>
                </div>

                <p:commandButton value="Pagar"
                                 action="#{tiendaBeanUI.realizarPagoInteractivoListaArticulos()}"
                                 update="msgsPagoInteractivo1 faltante1"
                                 styleClass="ui-button"
                                 process="@this montoIngresado1"
                                 style="background:#007bff !important; color:#fff !important; border:none !important;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog id="dlgCambio1"
                  header="Cambio Entregado"
                  widgetVar="dlgCambio1"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="300">

            <h:panelGrid columns="1" style="width:100%; text-align:center;">
                <h:outputText value="Cambio:" style="font-weight:bold; font-size:18px;"/>
                <h:outputText value="$#{tiendaBeanUI.montoCambio}"
                              style="font-size:22px; color:#28a745; margin:10px 0; display:block;">
                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                </h:outputText>

                <p:commandButton value="Continuar"
                                 icon="pi pi-check"
                                 actionListener="#{tiendaBeanUI.limpiarCampos()}"
                                 onclick="PF('dlgCambio1').hide();"
                                 update="@form"
                                 style="background:#007bff !important; color:#fff !important; border:none !important;"/>
            </h:panelGrid>
        </p:dialog>

        <p:dialog header="Pago por Pagar"
                  widgetVar="dlgPagoPorPagarM"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="420">

            <h:panelGrid id="panelPagoPorPagarM" columns="1" style="width:100%;">
                <p:messages id="msgsPorPagarM" showDetail="true" closable="true"/>

                <h:outputText value="Información del Cliente:" style="font-weight:bold; margin-bottom:10px;"/>

                <h:panelGrid columns="2" columnClasses="label,value" style="width:100%;">
                    <h:outputText value="ID Cliente:" style="color:#000000;"/>
                    <h:outputText value="#{tiendaBeanUI.cliente.idCliente}" style="color:#000000;"/>

                    <h:outputText value="Nombre del cliente:" style="color:#000000;"/>
                    <h:outputText value="#{tiendaBeanUI.cliente.nombreCompleto}" style="color:#000000;"/>

                    <h:outputText value="Monto Total:" style="color:#000000;"/>
                    <h:outputText value="#{tiendaBeanUI.montoTotal}" style="color:#000000;"/>

                    <h:outputText value="Fecha:" style="color:#000000;"/>
                    <h:outputText value="#{tiendaBeanUI.fecha}" style="color:#000000;">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                    </h:outputText>

                    <h:outputText value="Método de pago:" style="color:#000000;"/>
                    <h:outputText value="Por pagar" style="color:#17a2b8; font-weight:bold;"/>
                </h:panelGrid>

                <h:outputText value="Desea colocar este pago por Pagar ?"
                              style="margin-top:10px; display:block; text-align:center; font-style:italic;"/>

                <h:panelGroup layout="block" style="margin-top:15px; text-align:center;">
                    <p:commandButton id="btnPagoPorPagarM"
                                     value="Si, Colocar por Pagar"
                                     process="@this"
                                     update="msgsPorPagarM"
                                     actionListener="#{tiendaBeanUI.realizarPagoPorPagar()}"
                                     style="background:#007bff !important; color:#fff !important; border:none !important;"/>

                    <p:commandButton value="Cancelar"
                                     icon="pi pi-times"
                                     actionListener="#{tiendaBeanUI.limpiarCampos()}"
                                     update="@form"
                                     process="@this"
                                     oncomplete="PF('dlgPagoPorPagarM').hide();"
                                     style="background:#dc3545; color:#fff;"/>
                </h:panelGroup>
            </h:panelGrid>
        </p:dialog>

        <p:dialog id="dlgExitoPorPagar"
                  header="Pago por Pagar"
                  widgetVar="dlgExitoPorPagar"
                  modal="true"
                  resizable="false"
                  closable="false"
                  draggable="false"
                  width="300">

            <h:panelGrid columns="1" style="width:100%; text-align:center;">
                <h:outputText value="Pago Pendiente"
                              style="font-weight:bold; font-size:18px; color:#28a745;"/>

                <h:outputText value="Recuerde cobrar al cliente..." style="color:#000000;"/>

                <p:commandButton value="Continuar"
                                 icon="pi pi-check"
                                 actionListener="#{RealizarPagoBeanUI.limpiarCampos()}"
                                 onclick="PF('dlgExitoPorPagar').hide();"
                                 update="@form"
                                 style="background:#007bff !important; color:#fff !important; border:none !important;"/>
            </h:panelGrid>
        </p:dialog>
    </h:form>

</h:body>
</html>
