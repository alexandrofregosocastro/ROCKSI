<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Productos - Rock On</title>
    <meta charset="UTF-8"/>

    <style>
        body {
            margin: 0;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #f8f9fb;
        }

        /* BARRA LATERAL */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #007bcb;
            color: white;
            position: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Menú principal dentro de la barra lateral */
        .sidebar .menu {
            width: 100%;
            padding-top: 30px;
        }

        /* Enlaces del menú  */
        .sidebar a,
        .sidebar h\:commandLink {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white !important;
            text-decoration: none !important;
            padding: 10px 20px;
            font-size: 15px;
            transition: background 0.3s, transform 0.2s;
            margin-bottom: 10px;
        }

        /* Hover y estado activo */
        .sidebar a:hover,
        .sidebar h\:commandLink:hover,
        .sidebar .active {
            background: #0061a6 !important;
            border-radius: 6px;
        }

        /* Ícono dentro del menú */
        .menu-icon {
            width: 22px;
            height: 22px;
            filter: brightness(0) invert(1);
            transition: transform 0.2s ease;
        }

        /* Animación de ícono al pasar el mouse */
        .sidebar h\:commandLink:hover .menu-icon {
            transform: scale(1.15);
        }

        /* Logo inferior */
        .sidebar .logo-bottom {
            padding: 25px 0;
        }

        .sidebar .logo-bottom img {
            width: 130px;
            border-radius: 50%;
        }

        /* ESTILOS GENERALES */
        body {
            margin: 0;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #f8f9fb;
        }

        /* CONTENEDOR PRINCIPAL */
        .main-content {
            margin-left: 220px;
            padding: 30px 40px;
        }

        /* Encabezado de la página (título "Clases") */
        .header-clientes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #007bcb;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .header-clientes h1 {
            font-size: 26px;
            color: #000;
            margin: 0;
            font-weight: 700;
        }

        /* TARJETA CONTENEDORA */
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* BOTONES DE ACCIÓN */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .action-buttons .ui-button {
            border: none !important;
            border-radius: 20px !important;
            font-weight: 600 !important;
            padding: 6px 16px !important;
            font-size: 14px !important;
        }

        .btn-registrar {
            background: #007bcb !important;
            color: #fff !important;
        }

        .btn-modificar {
            background: #007bcb !important;
            color: #fff !important;
        }

        .btn-baja {
            background: #007bcb !important;
            color: #fff !important;
        }

        /* TABLA DE PRODUCTOS */
        .ui-datatable {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: none !important;
            margin-top: 5px;
        }

        .ui-datatable thead th {
            background-color: #007bcb !important;
            color: white !important;
            text-align: left !important;
            font-weight: 600 !important;
            padding: 10px 12px !important;
            border: none !important;
            font-size: 14px !important;
        }

        .ui-datatable tbody td {
            padding: 10px 12px !important;
            font-size: 14px !important;
            color: #222;
            border: none !important;
        }

        .ui-datatable tr:nth-child(even) {
            background-color: #f9f9f9 !important;
        }

        .ui-datatable tr:nth-child(odd) {
            background-color: #fff !important;
        }

        .ui-datatable tr:hover {
            background-color: #eef7ff !important;
        }

        .ui-datatable-tablewrapper {
            border-radius: 10px;
            overflow: hidden;
        }

        /* Boton cerrar */
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-focus {
            background: transparent !important;
            border: none !important;
            color: #555 !important;
            position: absolute !important;
            right: 10px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            transition: all 0.3s ease !important;
            box-shadow: none !important;
        }

        /* Boton cerrar on hover*/
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close:hover,
        .ui-dialog .ui-dialog-titlebar .ui-dialog-titlebar-close.ui-state-hover:hover {
            background-color: #dc3545 !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 28px !important;
            height: 28px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        /* Titulo del modal */
        .ui-dialog-title {
            width: 100% !important;
            text-align: center !important;
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #000 !important;
        }

        /* Contenido del modal */
        .form-group {
            background-color: #fff;
            border-radius: 15px;
            border: none;
            color: #000;
            padding: 20px;
        }

        /* Configracion del layout del modal */
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            width: 90%;
        }

        /* Configracion del layout del modal */
        .form-group label {
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .ui-dialog {
            background: white !important;
            border-radius: 15px !important;
            border: none !important;
        }

        /* Configuracion del titulo del modal */
        .ui-dialog-titlebar {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            position: relative;
            background: white !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .form-group {
            background: white !important;
            border: none !important;
        }

        /* Configuracion de estilo en el cuerpo del modal */
        .form-group {
            border: none;
            border-bottom: 2px solid #ccc;
            border-radius: 0;
            background: transparent;
            color: #000;
            font-size: 15px;
        }

        /* Configuracion de estilo en los campos cuando se aplica un focus*/
        .form-group:focus,
        .form-group:focus {
            border-color: #919191 !important;
            outline: none !important;
        }

        /* Configuracion en del boton registrar cliente*/
        .boton-registrar {
            border: none !important;
            border-radius: 8px !important;
            padding: 10px 16px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 15px auto 0 auto !important;
            width: 80% !important;
        }

        /* Configuracion en del boton registrar cliente*/
        .boton-registrar {
            margin-right: 8px;
            font-size: 16px;
        }

        .ui-confirmdialog {
            z-index: 1100 !important;
        }

        .ui-widget-overlay {
            z-index: 1000 !important;
        }

        /* === NUEVAS TABLAS (Productos / Carrito) === */
        .tienda-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        /* Contenedores de cada tabla */
        .tienda-box {
            flex: 1;
            min-width: 400px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            padding: 20px 25px;
        }

        /* Encabezado de cada bloque */
        .tienda-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            margin: 0 0 10px 0;
        }

        /* Input de búsqueda */
        .tienda-box input[type="text"],
        .tienda-box .ui-inputfield {
            width: 100% !important;
            border: 1px solid #ccc !important;
            border-radius: 6px !important;
            padding: 8px 10px !important;
            font-size: 14px !important;
            box-shadow: none !important;
            margin-bottom: 12px !important;
            transition: border-color 0.2s;
        }
        .tienda-box input[type="text"]:focus,
        .tienda-box .ui-inputfield.ui-state-focus {
            border-color: #007bcb !important;
        }

        /* Tablas internas */
        .tienda-box .ui-datatable {
            width: 100% !important;
            border-radius: 8px !important;
            border: none !important;
            overflow: hidden !important;
        }

        .tienda-box .ui-datatable thead th {
            background-color: #f4f6f8 !important;
            color: #000 !important;
            text-align: left !important;
            font-weight: 600 !important;
            padding: 8px 12px !important;
            border-bottom: 2px solid #e0e0e0 !important;
            font-size: 14px !important;
        }

        .tienda-box .ui-datatable tbody td {
            padding: 10px 12px !important;
            font-size: 14px !important;
            color: #333;
            border-bottom: 1px solid #f0f0f0 !important;
        }

        /* Hover de fila */
        .tienda-box .ui-datatable tbody tr:hover {
            background-color: #eef7ff !important;
        }

        /* Bloque de total */
        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #007bcb;
            color: white;
            padding: 10px 16px;
            margin-top: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
        }

        /* Botón de Cobrar */
        .btn-cobrar {
            margin-top: 12px;
            background: #007bcb !important;
            color: white !important;
            border: none !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            padding: 8px 18px !important;
            float: right;
            transition: all 0.2s ease-in-out;
        }
        .btn-cobrar:hover {
            background: #005c96 !important;
            transform: scale(1.05);
        }

        /* Encabezado de la sección "Productos" con buscador en la misma línea */
        .header-tienda {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        /* Título */
        .header-tienda h2 {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            margin: 0;
        }

        /* Campo de búsqueda */
        .buscar-producto {
            width: 220px !important;
            border: 2px solid #d8d8d8 !important;
            border-radius: 8px !important;
            padding: 8px 10px !important;
            font-size: 14px !important;
            box-shadow: none !important;
            transition: all 0.2s ease;
        }
        .buscar-producto:focus,
        .buscar-producto.ui-state-focus {
            border-color: #007bcb !important;
        }


    </style>
</h:head>

<h:body>
    <!-- Barra lateral -->
    <div class="sidebar">
        <div class="menu">
            <h:form>
                <!-- HOME -->
                <h:commandLink action="home.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('home')}"
                               styleClass="#{menuBeanUI.activePage eq 'home' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/home.png" alt="Home Icon" class="menu-icon"/>
                    <span>Home</span>
                </h:commandLink>

                <!-- CLIENTES -->
                <h:commandLink action="clientes.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clientes')}"
                               styleClass="#{menuBeanUI.activePage eq 'clientes' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clientes.png" alt="Clientes Icon" class="menu-icon"/>
                    <span>Clientes</span>
                </h:commandLink>

                <!-- TIENDA -->
                <h:commandLink action="tienda.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('tienda')}"
                               styleClass="#{menuBeanUI.activePage eq 'tienda' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/tienda.png" alt="Tienda Icon" class="menu-icon"/>
                    <span>Tienda</span>
                </h:commandLink>

                <!-- CLASES -->
                <h:commandLink action="clases.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('clases')}"
                               styleClass="#{menuBeanUI.activePage eq 'clases' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/clases.png" alt="Clases Icon" class="menu-icon"/>
                    <span>Clases</span>
                </h:commandLink>

                <!-- PAGOS -->
                <h:commandLink action="pagos.xhtml?faces-redirect=true"
                               actionListener="#{menuBeanUI.setActivePage('pagos')}"
                               styleClass="#{menuBeanUI.activePage eq 'pagos' ? 'active' : ''}">
                    <img src="resources-20250903T164359Z-1-001/resources/pagos.png" alt="Pagos Icon" class="menu-icon"/>
                    <span>Pagos</span>
                </h:commandLink>
            </h:form>
        </div>

        <!-- Logo inferior -->
        <div class="logo-bottom">
            <img src="resources-20250903T164359Z-1-001/resources/rockon-icon.png" alt="Rock On Logo"/>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="card">
            <h:form id="formProductos">
                <h1>Productos</h1>

                <!-- Tienda -->
                <div class="tienda-container">

                    <!-- Bloque de productos -->
                    <div class="tienda-box">
                        <div class="header-tienda">
                            <h2>Productos</h2>

                            <!-- Campo de búsqueda -->
                            <p:inputText id="buscarProducto"
                                         value="#{productoBeanUI.filtro}"
                                         placeholder="Buscar por ID Clase"
                                         styleClass="form-control buscar-producto">
                                <p:ajax event="input"
                                        listener="#{productoBeanUI.filtrarPorId}"
                                        update="tablaProductosMini"
                                        delay="300"/>
                            </p:inputText>
                        </div>

                        <!-- Mensajes -->
                        <p:growl id="msgs" showDetail="true" life="3000" />

                        <!-- Tabla de productos existentes -->
                        <p:dataTable id="tablaProductosMini"
                                     value="#{productoBeanUI.listaProductos}"
                                     var="pro"
                                     selectionMode="single"
                                     selection="#{productoBeanUI.productoSeleccionado}"
                                     rowKey="#{pro.idItem}"
                                     paginator="false"
                                     emptyMessage="No hay productos registrados">

                            <p:ajax event="rowDblselect"
                                    listener="#{tiendaBeanUI.agregarAlCarritoDesdeProductos}"
                                    update=":formProductos:tablaCarrito :formProductos:totalBox :formProductos:msgs :formProductos:tablaProductosMini" />

                            <p:column headerText="ID">
                                <h:outputText value="#{pro.idItem}" />
                            </p:column>
                            <p:column headerText="Nombre">
                                <h:outputText value="#{pro.nombre}" />
                            </p:column>
                            <p:column headerText="Precio">
                                <h:outputText value="$#{pro.precio}" />
                            </p:column>
                            <p:column headerText="Stock">
                                <h:outputText value="#{pro.stock}" />
                            </p:column>
                        </p:dataTable>
                    </div>

                    <!-- Bloque del carrito -->
                    <div class="tienda-box">
                        <h2>Carrito</h2>

                        <p:dataTable id="tablaCarrito"
                                     value="#{tiendaBeanUI.carrito}"
                                     var="item"
                                     paginator="false"
                                     emptyMessage="No hay productos en el carrito"
                                     selectionMode="single"
                                     selection="#{tiendaBeanUI.itemSeleccionado}"
                                     rowKey="#{item.id}">

                            <p:ajax event="rowDblselect"
                                    listener="#{tiendaBeanUI.devolverProductoAlInventario}"
                                    update=":formProductos:tablaCarrito :formProductos:tablaProductosMini :formProductos:totalBox :formProductos:msgs" />

                            <p:column headerText="ID">
                                <h:outputText value="#{item.id}" />
                            </p:column>
                            <p:column headerText="Nombre">
                                <h:outputText value="#{item.nombre}" />
                            </p:column>
                            <p:column headerText="Precio">
                                <h:outputText value="$#{item.precio}" />
                            </p:column>
                            <p:column headerText="Cantidad">
                                <h:outputText value="#{item.cantidad}" />
                            </p:column>
                        </p:dataTable>


                        <h:panelGroup id="totalBox" layout="block" styleClass="total-box">
                            <span>Total:</span>
                            <h:outputText value="#{tiendaBeanUI.total}">
                                <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2" />
                            </h:outputText>
                        </h:panelGroup>

                        <p:commandButton value="Cobrar"
                                         icon="pi pi-check"
                                         action="#{tiendaBeanUI.cobrar}"
                                         update="tablaCarrito totalBox msgs"
                                         styleClass="btn-cobrar" />
                    </div>

                </div>


                <div class="action-buttons" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                    <h:outputLabel for="txtFiltroProducto" value="ID Producto:"/>
                    <p:inputText id="txtFiltroProducto"
                                 value="#{productoBeanUI.filtro}"
                                 placeholder="Buscar producto"
                                 styleClass="form-control"
                                 style="width:220px;">
                        <p:ajax event="input"
                                listener="#{productoBeanUI.filtrarPorId}"
                                update="tablaProductos"
                                delay="300"/>
                    </p:inputText>

                    <!-- SUBMIT real (sin type="button") -->
                    <p:commandButton value="Actualizar Tabla" icon="pi pi-refresh"
                                     action="#{productoBeanUI.recargar}"
                                     update="tablaProductos"
                                     styleClass="btn-registrar"/>

                    <!-- Abren diálogos -->
                    <p:commandButton value="Alta de Producto" icon="pi pi-plus"
                                     styleClass="btn-registrar"
                                     onclick="PF('dlgAgregarProducto').show(); return false;"
                                     type="button"/>

                    <p:commandButton value="Modificar Producto" icon="pi pi-pencil" styleClass="btn-modificar"
                                     onclick="PF('dlgBuscarProd').show(); return false;" type="button"/>

                    <p:commandButton value="Baja de Producto" icon="pi pi-trash" styleClass="btn-baja"
                                     onclick="PF('dlgEliminarProducto').show(); return false;" type="button"/>

                </div>

                <!--Tabla-->
                <p:dataTable id="tablaProductos" value="#{productoBeanUI.listaProductos}" var="pro"
                             paginator="true" rows="8" emptyMessage="No hay productos registrados"
                             paginatorPosition="bottom" style="margin-top:20px;">
                    <p:column headerText="ID Producto" sortBy="#{pro.idItem}">
                        <h:outputText value="#{pro.idItem}"/>
                    </p:column>
                    <p:column headerText="Nombre" sortBy="#{pro.nombre}">
                        <h:outputText value="#{pro.nombre}"/>
                    </p:column>
                    <p:column headerText="Stock" sortBy="#{pro.stock}">
                        <h:outputText value="#{pro.stock}"/>
                    </p:column>
                    <p:column headerText="Precio por unidad" sortBy="#{pro.precio}">
                        <h:outputText value="#{pro.precio}"/>
                    </p:column>
                    <p:column headerText="Proveedor" sortBy="#{pro.proveedor}">
                        <h:outputText value="#{pro.proveedor}"/>
                    </p:column> <!--Proveedor agregado por sugerencia del cliente-->
                </p:dataTable>
            </h:form>
        </div>
    </div>

    <!-- dialogs -->
    <p:dialog header="Nuevo producto" widgetVar="dlgAgregarProducto" modal="true"
              resizable="false" closable="true" draggable="false" width="360">

        <h:form id="formAltaProducto">

            <p:messages id="msgsAltaProducto" showDetail="true" closable="true"/>

            <div class="form-group">
                <h:outputLabel for="nombreProducto" value="Nombre"/>
                <p:inputText id="nombreProducto"
                             value="#{altaProdBeanUI.nombre}"
                             placeholder="Nombre"
                             required="true"
                             requiredMessage="El campo Nombre es obligatorio"/>
            </div>

            <div class="form-group">
                <h:outputLabel for="stockProducto" value="Stock"/>
                <p:inputText id="stockProducto"
                             value="#{altaProdBeanUI.stock}"
                             placeholder="Existencia del producto"
                             required="true"
                             requiredMessage="El campo Stock es obligatorio">
                    <f:validateLongRange minimum="1"/>
                </p:inputText>
            </div>

            <div class="form-group">
                <h:outputLabel for="precioProducto" value="Precio"/>
                <p:inputText id="precioProducto"
                             value="#{altaProdBeanUI.precio}"
                             placeholder="Precio del producto"
                             required="true"
                             requiredMessage="El campo Precio es obligatorio">
                    <f:validateDoubleRange minimum="0.01"/>
                </p:inputText>
            </div>

            <div class="form-group">
                <h:outputLabel for="proveedorProducto" value="Proveedor"/>
                <p:inputText id="proveedorProducto"
                             value="#{altaProdBeanUI.proveedor}"
                             placeholder="Ej. cocacola, nestle"
                             required="true"
                             requiredMessage="El campo Proveedor es obligatorio"/>
            </div> <!--Proveedor gagregado-->

            <div class="boton-registrar">
                <p:commandButton id="registrarProductoBtn"
                                 value="Registrar el producto"
                                 icon="pi pi-plus-circle"
                                 action="#{altaProdBeanUI.altaProducto}"
                                 process="@form"
                                 update="msgsAltaProducto formProductos:tablaProductos"
                                 style="background:#007bff; color:#fff; border:none;"/>
            </div>
        </h:form>
    </p:dialog>

    <!-- dialogo para buscar el id del producto a modificar -->
    <p:dialog header="Buscar producto" widgetVar="dlgBuscarProd"
              modal="true" resizable="false" draggable="false" closable="true"
              width="380">

        <h:form id="formBuscarProd">
            <p:messages id="msgsAsk" showDetail="true" closable="true" />

            <div class="form-group" style="margin-top: 10px;">
                <h:outputLabel for="busquedaId" value="ID del producto:"/>
                <p:inputText id="busquedaId"
                             value="#{modificarProdBeanUI.busquedaId}"
                             placeholder="Ejemplo: PR1001"
                             style="width:100%" required="true"
                             requiredMessage="Debe ingresar un ID."/>
            </div>

            <div style="text-align:center; margin-top:1em;">
                <p:commandButton value="Buscar"
                                 icon="pi pi-search"
                                 action="#{modificarProdBeanUI.cargarProductoPorId}"
                                 update="formBuscarProd:msgsAsk, formModificarProd"
                                 oncomplete="if (args &amp;&amp; args.found){PF('dlgBuscarProd').hide();PF('dlgModificarProd').show();}"/>
            </div>
        </h:form>
    </p:dialog>

    <!-- dialogo para modificar el producto -->
    <p:dialog header="Modificar producto" widgetVar="dlgModificarProd"
              modal="true" resizable="false" draggable="false" closable="true"
              width="420">

        <h:form id="formModificarProd">
            <p:messages id="msgsModificar" showDetail="true" closable="true" />

            <h:panelGrid columns="1" cellpadding="5" style="width:100%;">

                <!-- Campo Nombre -->
                <h:outputLabel for="nombre" value="Nombre"/>
                <p:inputText id="nombre" value="#{modificarProdBeanUI.nombre}"
                             placeholder="Nombre del producto" style="width:100%" required="true"
                             requiredMessage="El nombre es obligatorio."/>

                <!-- Campo Stock -->
                <h:outputLabel for="stock" value="Stock"/>
                <p:inputNumber id="stock" value="#{modificarProdBeanUI.stock}"
                               placeholder="Existencia del producto" style="width:100%"
                               minValue="0" required="true"
                               requiredMessage="El stock es obligatorio."/>

                <!-- Campo Precio -->
                <h:outputLabel for="precio" value="Precio"/>
                <p:inputNumber id="precio" value="#{modificarProdBeanUI.precio}"
                               placeholder="Precio del producto" style="width:100%"
                               decimalPlaces="2" minValue="0"
                               required="true" requiredMessage="El precio es obligatorio."/>

                <h:outputLabel for="proveedor" value="Proveedor"/>
                <p:inputText id="proveedor"
                             value="#{modificarProdBeanUI.proveedor}"
                             placeholder="Proveedor del producto"
                             style="width:100%"
                             required="true"
                             requiredMessage="El proveedor es obligatorio."/>

            </h:panelGrid>

            <div style="text-align:center; margin-top:15px;">
                <p:commandButton value="Guardar cambios"
                                 icon="pi pi-check"
                                 action="#{modificarProdBeanUI.modificarProducto}"
                                 update="msgsModificar formBuscarProd:msgsAsk"
                                 oncomplete="if (!args.validationFailed) { PF('dlgModificarProd').hide(); PF('dlgBuscarProd').show(); }"/>
            </div>

            <div style="text-align:center; margin-top:10px;">
                <p:commandButton value="Cancelar"
                                 icon="pi pi-times"
                                 type="button"
                                 onclick="PF('dlgModificarProd').hide(); PF('dlgBuscarProd').show();"/>
            </div>

        </h:form>
    </p:dialog>

    <!-- Eliminar Producto -->
    <p:dialog header="Eliminar Producto" widgetVar="dlgEliminarProducto"
                  modal="true" resizable="false" closable="true"
                  draggable="false" width="360">
        <h:form id="formEliminarProducto">

            <!-- Mensajes del backend -->
            <p:messages id="msgsEliminarProducto" showDetail="true" closable="true"/>

            <div class="form-group">
                <h:outputLabel for="idEliminarProducto" value="ID del Producto"/>
                <p:inputText id="idEliminarProducto"
                             value="#{bajaProductoBeanUI.idProducto}"
                             placeholder="ID del producto a eliminar"
                             required="true"
                             requiredMessage="El campo ID es obligatorio"/>
            </div>

            <!-- Botón que abre el modal de confirmación -->
            <p:commandButton id="abrirConfirmarProductoBtn" value="Eliminar Producto"
                             icon="pi pi-times-circle"
                             styleClass="btn-baja"
                             onclick="PF('dlgConfirmar').show(); return false;"
                             type="button"/>

            <!-- Diálogo de confirmación -->
            <p:confirmDialog id="confirmDialog"
                             widgetVar="dlgConfirmar"
                             header="Confirmar Eliminación"
                             message="¿Seguro que deseas eliminar este producto?"
                             icon="pi pi-exclamation-triangle"
                             closable="false" modal="true">

                <!-- Botón SÍ -->
                <p:commandButton value="Sí, eliminar"
                                 icon="pi pi-check"
                                 action="#{bajaProductoBeanUI.eliminarProducto}"
                                 process="@form"
                                 update="msgsEliminarProducto :formProductos:tablaProductos"
                                 oncomplete="PF('dlgConfirmar').hide();"
                                 style="background:#007bff !important; color:#fff !important; border:none !important;"/>

                <!-- Botón CANCELAR -->
                <p:commandButton value="Cancelar"
                                 icon="pi pi-times"
                                 onclick="PF('dlgConfirmar').hide(); return false;"
                                 type="button"
                                 style="background:#007bff !important; color:#fff !important; border:none !important;"/>
            </p:confirmDialog>
        </h:form>
    </p:dialog>


</h:body>
</html>
